openapi: 3.1.0
info:
  title: 显问 GEO 智能体系统 API
  version: 1.0.0
  description: |
    V1 API 启动骨架。实现过程中必须持续补全 schemas、examples、权限和错误响应。
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: System
  - name: Auth
  - name: Me
  - name: Plans
  - name: Subjects
  - name: Documents
  - name: Keywords
  - name: Questions
  - name: GEO
  - name: Articles
  - name: Images
  - name: Videos
  - name: Publishing
  - name: Reports
  - name: Assistant
  - name: Admin
paths:
  /health:
    get:
      tags: [System]
      security: []
      summary: 服务及依赖健康检查
      responses:
        '200':
          description: API、数据库和 Redis 均可用
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
              example:
                success: true
                data:
                  status: ok
                request_id: 24c5291c-9172-49e5-a970-d3a41426dff3
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/csrf:
    get:
      tags: [Auth]
      security: []
      summary: 获取用于会话认证写请求的 CSRF Token
      responses:
        '200':
          description: CSRF Token 已生成，并设置可由前端读取的 xianwen_csrf Cookie
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: xianwen_csrf Cookie；production 使用 Secure
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfEnvelope'
  /auth/sms/send:
    post:
      tags: [Auth]
      security: []
      summary: 发送注册、登录或密码重置短信验证码
      description: 响应不包含验证码、账号存在性、Provider 结果或具体限流阈值。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
      responses:
        '200':
          description: 发送请求已由短信 Provider 接受
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendEnvelope'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: 通过手机号、昵称、短信验证码和密码公开注册 USER
      description: |
        使用 register 用途验证码。验证码先在 Redis 原子消费，再执行 PostgreSQL 事务；
        两者不存在分布式事务。注册成功后账号直接进入正常状态并建立浏览器会话，首页为
        /workspace。ref 是可选的后端签名管理员渠道标识，不接受 admin_id 作为归属依据；
        有效 ref 建立管理员关联，无 ref 或无效 ref 创建独立用户且不阻塞注册。手机号是否已注册仅在
        验证码成功消费后通过 ACCOUNT_ALREADY_EXISTS 返回。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: 注册成功并建立 HttpOnly Session
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: HttpOnly xianwen_session Cookie；production 使用 Secure
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '409':
          $ref: '#/components/responses/AccountAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationOrVerificationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/registration-ref:
    get:
      tags: [Auth]
      security: []
      summary: 验证代理专属注册链接 ref
      parameters:
        - name: ref
          in: query
          required: true
          schema: {type: string, maxLength: 512}
      responses:
        '200':
          description: ref 有效，仅返回可公开的渠道名称
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistrationReferenceEnvelope'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /auth/login/sms:
    post:
      tags: [Auth]
      security: []
      summary: 手机号与短信验证码登录
      description: |
        使用 login 用途验证码并原子消费。错误验证码、过期、重放和不存在账号统一返回
        AUTH_CREDENTIALS_INVALID；不会自动创建用户。账号是否可登录由账号状态控制。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsLoginRequest'
      responses:
        '200':
          description: 登录成功，轮换 Session ID 并建立最长 12 小时的浏览器会话
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: HttpOnly xianwen_session Cookie；production 使用 Secure
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/AuthCredentialsInvalid'
        '403':
          description: CSRF 验证失败，或账号已冻结/注销
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/password/reset:
    post:
      tags: [Auth]
      security: []
      summary: 使用短信验证码重置密码
      description: |
        使用 password_reset 用途验证码。成功后不自动登录；密码哈希变化会使所有旧 Session
        在后续请求时失效。不存在或已注销账号在验证码有效时返回相同通用成功响应。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: 密码重置处理完成；不表示账号存在
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetEnvelope'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '422':
          $ref: '#/components/responses/ValidationOrVerificationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/login/password:
    post:
      tags: [Auth]
      security: []
      summary: 中国大陆手机号与密码登录
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: 登录成功，建立最长 12 小时的浏览器会话
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: HttpOnly xianwen_session Cookie
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出当前会话
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 当前会话已失效
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
  /me:
    get:
      tags: [Me]
      summary: 当前用户的最小账号状态
      responses:
        '200':
          description: 当前用户信息
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
  /me/profile:
    patch:
      tags: [Me]
      summary: 修改当前普通用户昵称
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: 个人资料已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/phone/code:
    post:
      tags: [Me]
      summary: 向新手机号发送换绑验证码
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCodeSendRequest'
      responses:
        '200':
          description: 验证码已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me/phone:
    patch:
      tags: [Me]
      summary: 验证新手机号并完成换绑
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneChangeRequest'
      responses:
        '200':
          description: 手机号已修改，所有会话已退出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCredentialChangedEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me/password:
    patch:
      tags: [Me]
      summary: 修改当前普通用户密码
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: 密码已修改，所有会话已退出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCredentialChangedEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me/appearance:
    patch:
      tags: [Me]
      summary: 保存当前普通用户的界面外观
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppearanceUpdateRequest'
      responses:
        '200':
          description: 外观设置已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/sessions/revoke:
    post:
      tags: [Me]
      summary: 退出当前用户的其他设备
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRevokeRequest'
      responses:
        '200':
          description: 其他设备已退出，当前会话保持登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /notifications:
    get:
      tags: [Me]
      summary: 当前用户的账号状态通知
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 仅返回当前用户的通知
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPageEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '422':
          $ref: '#/components/responses/ValidationError'
  /notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [Me]
      summary: 标记自己的通知为已读
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 通知已标记为已读；重复调用返回当前通知
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /files/upload-intents:
    post:
      tags: [Documents]
      summary: Create a private size-bound direct-upload intent
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FileUploadIntentCreateRequest'}
      responses:
        '201':
          description: Intent and short-lived constrained presigned POST credential
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileUploadIntentCreateEnvelope'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '409': {$ref: '#/components/responses/BusinessConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /files/upload-intents/{intentId}:
    parameters:
      - name: intentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Documents]
      summary: Poll an owner-scoped upload intent
      responses:
        '200':
          description: Safe upload state; no object key, hash, scanner detail, or secret
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileUploadIntentEnvelope'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
  /files/upload-intents/{intentId}/complete:
    parameters:
      - name: intentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Documents]
      summary: Mark an uploaded object for asynchronous verification
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FileUploadIntentCompleteRequest'}
      responses:
        '202':
          description: Verification accepted; poll the intent resource
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileUploadIntentEnvelope'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/BusinessConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /subjects/{subjectId}/documents:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      tags: [Documents]
      summary: List completed clean document versions for an owner-scoped subject
      responses:
        '200':
          description: Private subject documents without storage internals
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubjectDocumentListEnvelope'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
  /documents/{documentId}/download-intents:
    parameters:
      - name: documentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Documents]
      summary: Create a short-lived private attachment download credential
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Short-lived download credential
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentDownloadIntentEnvelope'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /documents/{documentId}/parse:
    parameters:
      - name: documentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Documents]
      summary: Queue owner-scoped parsing of a completed clean document version
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentParseRequest'}
      responses:
        '202':
          description: Parse job accepted; unconfirmed output is not usable by downstream features
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentParseJobEnvelope'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/BusinessConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /documents/{documentId}/parse-result:
    parameters:
      - name: documentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Documents]
      summary: Read the owner-scoped parse state and bounded result
      responses:
        '200':
          description: Safe parse projection without object keys, hashes, digests, leases or raw errors
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentParseResultEnvelope'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
  /documents/{documentId}/confirm:
    parameters:
      - name: documentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Documents]
      summary: Create an immutable user-confirmed canonical-text version
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentParseConfirmRequest'}
      responses:
        '200':
          description: Existing identical confirmation replay or newly created confirmation
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentParseConfirmEnvelope'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/BusinessConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /web-sources/import:
    post:
      tags: [Web Sources]
      summary: Queue an owner-scoped public web import through the isolated fetch worker
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 200, writeOnly: true}
      requestBody:
        required: true
        content:
          application/json:
