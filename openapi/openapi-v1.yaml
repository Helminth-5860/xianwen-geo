        status: {type: string, enum: [active, inactive]}
        data_scope: {type: string, enum: [own, role, all]}
        version: {type: integer, minimum: 1}
        require_sms_2fa: {type: boolean}
        ip_allowlist_enabled: {type: boolean}
        security_version: {type: integer, minimum: 1}
        permission_keys: {type: array, items: {type: string}}
