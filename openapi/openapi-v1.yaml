      responses:
        '200': {description: 静态动作目录及当前策略}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
  /admin/risk-policies:
    get:
      tags: [Admin]
      summary: 超级管理员查看全部风险策略
      responses:
        '200': {description: 风险策略列表}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
  /admin/risk-policies/{actionKey}:
    parameters:
      - name: actionKey
        in: path
        required: true
        schema: {type: string, maxLength: 100}
    patch:
      tags: [Admin]
      summary: 固定保护地更新风险策略
      description: 始终要求有效超级管理员、当前密码、真实 CSRF、确认和乐观版本，不递归使用可配置策略。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RiskPolicyUpdateRequest'}}}}
      responses:
        '200': {description: 风险策略已更新}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {description: 权限、CSRF 或当前密码验证失败}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {description: RISK_POLICY_VERSION_CONFLICT}
        '422': {description: 不支持模式、低于最低模式或缺少确认}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
