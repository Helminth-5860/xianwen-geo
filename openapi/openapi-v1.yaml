openapi: 3.1.0
info:
  title: 显问 GEO 智能体系统 API
  version: 1.0.0
  description: |
    V1 API 启动骨架。实现过程中必须持续补全 schemas、examples、权限和错误响应。
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: System
  - name: Auth
  - name: Me
  - name: Plans
  - name: Subjects
  - name: Documents
  - name: Keywords
  - name: Questions
  - name: GEO
  - name: Articles
  - name: Images
  - name: Publishing
  - name: Reports
  - name: Assistant
  - name: Admin
paths:
  /health:
    get:
      tags: [System]
      security: []
      summary: 服务及依赖健康检查
      responses:
        '200':
          description: API、数据库和 Redis 均可用
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
              example:
                success: true
                data:
                  status: ok
                request_id: 24c5291c-9172-49e5-a970-d3a41426dff3
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/csrf:
    get:
      tags: [Auth]
      security: []
      summary: 获取用于会话认证写请求的 CSRF Token
      responses:
        '200':
          description: CSRF Token 已生成，并设置可由前端读取的 xianwen_csrf Cookie
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: xianwen_csrf Cookie；production 使用 Secure
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfEnvelope'
  /auth/sms/send:
    post:
      tags: [Auth]
      security: []
      summary: 发送注册、登录或密码重置短信验证码
      description: 响应不包含验证码、账号存在性、Provider 结果或具体限流阈值。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
      responses:
        '200':
          description: 发送请求已由短信 Provider 接受
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendEnvelope'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: 手机号、昵称、短信验证码和密码注册
      description: |
        使用 register 用途验证码。验证码先在 Redis 原子消费，再执行 PostgreSQL 事务；
        两者不存在分布式事务。注册成功后建立 12 小时浏览器会话，账号初始为待审核。
        手机号是否已注册仅在验证码成功消费后通过 ACCOUNT_ALREADY_EXISTS 返回。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: 注册成功并建立 HttpOnly Session
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: HttpOnly xianwen_session Cookie；production 使用 Secure
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '409':
          $ref: '#/components/responses/AccountAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationOrVerificationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/login/sms:
    post:
      tags: [Auth]
      security: []
      summary: 手机号与短信验证码登录
      description: |
        使用 login 用途验证码并原子消费。错误验证码、过期、重放和不存在账号统一返回
        AUTH_CREDENTIALS_INVALID；不会自动创建用户。审核状态不影响登录。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsLoginRequest'
      responses:
        '200':
          description: 登录成功，轮换 Session ID 并建立最长 12 小时的浏览器会话
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: HttpOnly xianwen_session Cookie；production 使用 Secure
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/AuthCredentialsInvalid'
        '403':
          description: CSRF 验证失败，或账号已冻结/注销
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/password/reset:
    post:
      tags: [Auth]
      security: []
      summary: 使用短信验证码重置密码
      description: |
        使用 password_reset 用途验证码。成功后不自动登录；密码哈希变化会使所有旧 Session
        在后续请求时失效。不存在或已注销账号在验证码有效时返回相同通用成功响应。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: 密码重置处理完成；不表示账号存在
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetEnvelope'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '422':
          $ref: '#/components/responses/ValidationOrVerificationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/login/password:
    post:
      tags: [Auth]
      security: []
      summary: 中国大陆手机号与密码登录
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: 登录成功，建立最长 12 小时的浏览器会话
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: HttpOnly xianwen_session Cookie
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出当前会话
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 当前会话已失效
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
  /me:
    get:
      tags: [Me]
      summary: 当前用户的最小账号状态
      responses:
        '200':
          description: 当前用户信息
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
  /me/approval/resubmit:
    post:
      tags: [Me]
      summary: 审核拒绝用户重新提交资料
      description: 仅 rejected 用户可调用；可选更新昵称，不能修改手机号。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalResubmitRequest'
      responses:
        '200':
          description: 已重新提交，审核状态变为 pending
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '409':
          $ref: '#/components/responses/ApprovalStateConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /notifications:
    get:
      tags: [Me]
      summary: 当前用户的账号状态通知
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 仅返回当前用户的通知
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPageEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '422':
          $ref: '#/components/responses/ValidationError'
  /notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [Me]
      summary: 标记自己的通知为已读
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 通知已标记为已读；重复调用返回当前通知
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /plans:
    get:
      tags: [Plans]
      security: []
      summary: 展示套餐列表
      responses:
        '200':
          description: 套餐列表
  /package-applications:
    post:
      tags: [Plans]
      summary: 申请开通套餐
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: {type: string, format: uuid}
                contact_name: {type: string}
                contact_phone: {type: string}
                note: {type: string}
      responses:
        '201': {description: 已提交}
  /subjects:
    get:
      tags: [Subjects]
      summary: 主体列表
      responses:
        '200': {description: 主体列表}
    post:
      tags: [Subjects]
      summary: 创建主体草稿
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubjectRequest'
      responses:
        '201': {description: 创建成功}
        '409':
          $ref: '#/components/responses/BusinessConflict'
  /subjects/{subjectId}:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      tags: [Subjects]
      summary: 当前主体详情
      responses:
        '200': {description: 主体详情}
        '404': {description: 不存在或无权访问}
  /subjects/{subjectId}/commit:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    post:
      tags: [Subjects]
      summary: 校验草稿并创建主体资料版本
      responses:
        '201': {description: 新资料版本}
        '422':
          $ref: '#/components/responses/ValidationError'
  /subjects/{subjectId}/keywords/generate:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Keywords]
      summary: 生成关键词
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeywordGenerationRequest'
      responses:
        '202':
          description: 关键词生成任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '409':
          $ref: '#/components/responses/BusinessConflict'
  /subjects/{subjectId}/distillations:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Keywords]
      summary: 发起关键词蒸馏
      responses:
        '202':
          description: 关键词蒸馏任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /subjects/{subjectId}/question-banks/generate:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Questions]
      summary: 生成问题库
      responses:
        '202':
          description: 问题库生成任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /subjects/{subjectId}/geo/estimate:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    post:
      tags: [GEO]
      summary: 估算检测点
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoDetectionSelection'
      responses:
        '200':
          description: 估算结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoEstimateEnvelope'
  /subjects/{subjectId}/geo/detections:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [GEO]
      summary: 创建 GEO 检测任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoDetectionSelection'
      responses:
        '202':
          description: GEO 检测任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '409':
          $ref: '#/components/responses/BusinessConflict'
  /geo/detections/{detectionId}:
    parameters:
      - name: detectionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [GEO]
      summary: 检测任务进度
      responses:
        '200':
          description: 检测任务当前进度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /geo/detections/{detectionId}/cancel:
    parameters:
      - name: detectionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [GEO]
      summary: 取消尚未开始的调用
      responses:
        '200': {description: 已受理取消}
        '409':
          $ref: '#/components/responses/BusinessConflict'
  /geo/reports/{reportId}:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Reports]
      summary: GEO 报告首页数据
      responses:
        '200': {description: 报告数据}
  /geo/reports/{reportId}/strategies:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Reports]
      summary: 生成 GEO 改善策略
      responses:
        '202':
          description: 改善策略生成任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /assistant/respond:
    post:
      tags: [Assistant]
      summary: 显问 AI 助手单次回复，不保存聊天记录
      responses:
        '200': {description: 助手回复}
        '409':
          $ref: '#/components/responses/BusinessConflict'
  /subjects/{subjectId}/articles:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      tags: [Articles]
      summary: 文章列表
      responses:
        '200': {description: 文章列表}
    post:
      tags: [Articles]
      summary: 创建文章草稿
      responses:
        '201': {description: 文章草稿}
  /articles/{articleId}/generate:
    parameters:
      - name: articleId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Articles]
      summary: 生成正文并冻结文章额度
      responses:
        '202':
          description: 文章生成任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /articles/{articleId}/channel-adaptations:
    parameters:
      - name: articleId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Publishing]
      summary: 批量生成渠道适配稿
      responses:
        '202':
          description: 渠道适配任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /subjects/{subjectId}/images/generate:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Images]
      summary: 生成一张或一组图片
      responses:
        '202':
          description: 图片生成任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /publication-checks:
    post:
      tags: [Publishing]
      summary: 即时检测发布链接
      responses:
        '200': {description: 发布成功、失败或暂时无法判断}
  /geo/reports/{reportId}/exports:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Reports]
      summary: 生成 PDF、Word 或 Excel
      responses:
        '202':
          description: 报告导出任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /geo/reports/{reportId}/shares:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Reports]
      summary: 创建完整报告分享链接
      responses:
        '201': {description: 分享创建成功}
  /admin/users:
    get:
      tags: [Admin]
      summary: 管理员用户审核列表
      description: 仅有效 staff 可访问；完整手机号只用于精确筛选，响应始终脱敏。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: approval_status
          in: query
          schema:
            $ref: '#/components/schemas/ApprovalStatus'
        - name: account_status
          in: query
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - name: phone
          in: query
          description: 完整手机号，规范化后精确匹配；不会写入请求日志。
          schema: {type: string}
      responses:
        '200':
          description: 稳定按 created_at、id 排序的用户分页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPageEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      summary: 管理员查看用户审核详情
      responses:
        '200':
          description: 用户最小详情；仅 rejected 状态展示当前拒绝原因
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /admin/users/{userId}/history:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      summary: 用户审核及账号状态追加式历史
      description: 普通 API 只读，不提供更新或删除操作。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 状态历史分页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatusEventPageEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/users/{userId}/review:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      summary: 通过或拒绝待审核用户
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUserRequest'
      responses:
        '200':
          description: 审核状态、历史和通知已在同一事务提交
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          description: CSRF 失败、非有效 staff 或目标为 staff/superuser
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ApprovalStateConflict'
        '422':
          description: 参数校验失败或拒绝原因缺失
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/users/{userId}/freeze:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      summary: 冻结 active 用户并撤销全部旧 Session
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountStatusActionRequest'
      responses:
        '200':
          description: 用户已冻结，旧 Session 下一次访问均按匿名处理
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/AccountStateConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/users/{userId}/unfreeze:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      summary: 解冻 frozen 用户，不恢复任何旧 Session
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountStatusActionRequest'
      responses:
        '200':
          description: 用户已解冻，必须重新登录
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/AccountStateConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/api-credentials:
    get:
      tags: [Admin]
      summary: API 密钥掩码列表，仅超级管理员
      responses:
        '200': {description: 只返回掩码和状态}
        '403': {description: 非超级管理员禁止}
    post:
      tags: [Admin]
      summary: 新增 API 密钥，明文只在请求中出现
      responses:
        '201': {description: 保存后只返回掩码}
  /admin/auth/login/password:
    post:
      tags: [Admin]
      security: []
      summary: 管理员密码认证；按策略返回完整会话或临时二次验证 challenge
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminPasswordLoginRequest'}}}}
      responses:
        '200': {description: 管理员认证步骤成功, content: {application/json: {schema: {$ref: '#/components/schemas/AdminPasswordLoginEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {description: CSRF 失败、管理员入口限制或 IP 不允许}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/auth/login/sms/send:
    post:
      tags: [Admin]
      security: []
      summary: 为有效管理员登录 challenge 发送短信验证码
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminChallengeRequest'}}}}
      responses:
        '200': {description: 短信发送已受理}
        '401': {description: challenge 无效、过期或上下文不匹配}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/auth/login/sms/verify:
    post:
      tags: [Admin]
      security: []
      summary: 验证管理员登录 challenge 并建立完整 Session
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminChallengeVerifyRequest'}}}}
      responses:
        '200': {description: 管理员完整 Session 已建立}
        '401': {description: challenge 或验证码无效、过期、已消费或上下文不匹配}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/auth/logout:
    post:
      tags: [Admin]
      summary: 注销当前管理员 Session
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '200': {description: 管理员 Session 已注销}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/me:
    get:
      tags: [Admin]
      summary: 当前管理员能力与菜单
      responses:
        '200': {description: 管理员上下文, content: {application/json: {schema: {$ref: '#/components/schemas/AdminContextEnvelope'}}}}
        '403': {$ref: '#/components/responses/PermissionDenied'}
  /admin/admins:
    get:
      tags: [Admin]
      summary: 管理员列表
      responses:
        '200': {description: 管理员分页列表}
        '403': {$ref: '#/components/responses/PermissionDenied'}
    post:
      tags: [Admin]
      summary: 创建普通管理员
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminCreateRequest'}}}}
      responses:
        '201': {description: 已创建}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/admins/{adminId}:
    parameters: [{$ref: '#/components/parameters/AdminId'}]
    get:
      tags: [Admin]
      summary: 管理员详情
      responses: {'200': {description: 管理员详情}, '404': {$ref: '#/components/responses/ResourceNotFound'}}
    patch:
      tags: [Admin]
      summary: 修改管理员资料或角色
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUpdateRequest'}}}}
      responses: {'200': {description: 已更新}, '409': {description: ADMIN_VERSION_CONFLICT}}
  /admin/admins/{adminId}/force-logout:
    parameters: [{$ref: '#/components/parameters/AdminId'}]
    post:
      tags: [Admin]
      summary: administrator security session_version administrator security Session
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      responses: {'200': {description: 当前或目标管理员的既有 Session 已撤销}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '500': {$ref: '#/components/responses/InternalError'}}
  /admin/admins/{adminId}/disable:
    $ref: '#/components/pathItems/AdminStatusAction'
  /admin/admins/{adminId}/enable:
    $ref: '#/components/pathItems/AdminStatusAction'
  /admin/admins/{adminId}/lock:
    $ref: '#/components/pathItems/AdminStatusAction'
  /admin/admins/{adminId}/unlock:
    $ref: '#/components/pathItems/AdminStatusAction'
  /admin/roles:
    get:
      tags: [Admin]
      summary: 角色列表
      responses: {'200': {description: 角色分页列表}}
    post:
      tags: [Admin]
      summary: 创建角色
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleCreateRequest'}}}}
      responses: {'201': {description: 已创建}, '403': {$ref: '#/components/responses/PermissionDenied'}}
  /admin/roles/{roleId}:
    parameters: [{$ref: '#/components/parameters/RoleId'}]
    get:
      tags: [Admin]
      summary: 角色详情
      responses: {'200': {description: 角色详情}}
    patch:
      tags: [Admin]
      summary: 更新角色、数据范围和权限
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleUpdateRequest'}}}}
      responses: {'200': {description: 已更新}, '409': {description: ROLE_VERSION_CONFLICT}}
  /admin/roles/{roleId}/disable:
    post:
      tags: [Admin]
      summary: 停用未被使用的角色
      parameters: [{$ref: '#/components/parameters/RoleId'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExpectedVersionRequest'}}}}
      responses: {'200': {description: 已停用}, '409': {description: ROLE_IN_USE 或 ROLE_VERSION_CONFLICT}}
  /admin/roles/{roleId}/security:
    parameters: [{$ref: '#/components/parameters/RoleId'}]
    get:
      tags: [Admin]
      summary: 查询角色二次验证与 IP 白名单策略
      responses: {'200': {description: 角色安全策略}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '500': {$ref: '#/components/responses/InternalError'}}
    patch:
      tags: [Admin]
      summary: 原子更新角色安全策略并撤销旧 Session/challenge
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleSecurityMutation'}}}}
      responses: {'200': {description: 角色安全策略已更新}, '403': {description: 权限、CSRF、密码再验证或 IP 检查失败}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {description: SECURITY_POLICY_VERSION_CONFLICT 或锁出确认缺失}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}, '500': {$ref: '#/components/responses/InternalError'}}
  /admin/roles/{roleId}/ip-allowlist:
    parameters: [{$ref: '#/components/parameters/RoleId'}]
    get:
      tags: [Admin]
      summary: 查询角色 IP 白名单条目
      responses: {'200': {description: 角色 IP 白名单条目}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '500': {$ref: '#/components/responses/InternalError'}}
    post:
      tags: [Admin]
      summary: 新增或恢复角色 CIDR 条目
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IpAllowlistCreateRequest'}}}}
      responses: {'201': {description: 角色 CIDR 条目已保存}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {description: 安全策略版本冲突或锁出确认缺失}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}, '500': {$ref: '#/components/responses/InternalError'}}
  /admin/roles/{roleId}/ip-allowlist/{entryId}:
    parameters: [{$ref: '#/components/parameters/RoleId'}, {name: entryId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      tags: [Admin]
      summary: 更新角色 CIDR 条目状态；不物理删除
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IpAllowlistUpdateRequest'}}}}
      responses: {'200': {description: 角色 CIDR 条目已更新}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {description: 安全策略版本冲突或锁出确认缺失}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}, '500': {$ref: '#/components/responses/InternalError'}}
  /admin/security/superuser:
    get:
      tags: [Admin]
      summary: 查询当前超级管理员强制 2FA 与 IP 白名单策略
      responses: {'200': {description: 超级管理员安全策略}, '403': {$ref: '#/components/responses/PermissionDenied'}, '500': {$ref: '#/components/responses/InternalError'}}
    patch:
      tags: [Admin]
      summary: 更新当前超级管理员 IP 白名单策略；2FA 始终开启
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SuperuserSecurityMutation'}}}}
      responses: {'200': {description: 超级管理员安全策略已更新}, '403': {description: 权限、CSRF、密码再验证或 IP 检查失败}, '409': {description: 安全策略版本冲突或锁出确认缺失}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}, '500': {$ref: '#/components/responses/InternalError'}}
  /admin/security/superuser/ip-allowlist:
    get:
      tags: [Admin]
      summary: 查询当前超级管理员 IP 白名单条目
      responses: {'200': {description: 超级管理员 IP 白名单条目}, '403': {$ref: '#/components/responses/PermissionDenied'}, '500': {$ref: '#/components/responses/InternalError'}}
    post:
      tags: [Admin]
      summary: 新增或恢复超级管理员 CIDR 条目
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IpAllowlistCreateRequest'}}}}
      responses: {'201': {description: 超级管理员 CIDR 条目已保存}, '403': {$ref: '#/components/responses/PermissionDenied'}, '409': {description: 安全策略版本冲突或锁出确认缺失}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}, '500': {$ref: '#/components/responses/InternalError'}}
  /admin/security/superuser/ip-allowlist/{entryId}:
    parameters: [{name: entryId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      tags: [Admin]
      summary: 更新超级管理员 CIDR 条目状态；不物理删除
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IpAllowlistUpdateRequest'}}}}
      responses: {'200': {description: 超级管理员 CIDR 条目已更新}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {description: 安全策略版本冲突或锁出确认缺失}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}, '500': {$ref: '#/components/responses/InternalError'}}
  /admin/permissions:
    get:
      tags: [Admin]
      summary: 只读稳定权限目录
      responses: {'200': {description: 权限目录}}
  /admin/users/{userId}/assignment:
    put:
      tags: [Admin]
      summary: 分配、转交或解除客户负责人
      parameters: [{$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssignmentUpdateRequest'}}}}
      responses: {'200': {description: 当前归属}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {description: ASSIGNMENT_VERSION_CONFLICT}}
components:
  pathItems:
    AdminStatusAction:
      parameters:
        - $ref: '#/components/parameters/AdminId'
      post:
        tags: [Admin]
        summary: 管理员状态转换
        parameters:
          - $ref: '#/components/parameters/CsrfToken'
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExpectedVersionRequest'}
        responses:
          '200': {description: 状态已更新}
          '409': {description: ADMIN_STATE_CONFLICT、ADMIN_VERSION_CONFLICT、ADMIN_HAS_ASSIGNED_CUSTOMERS 或 LAST_SUPERUSER_PROTECTED}
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: xianwen_session
  headers:
    RequestId:
      description: 本次请求的规范 UUID；与响应体 request_id 完全一致
      required: true
      schema:
        type: string
        format: uuid
  parameters:
    AdminId:
      name: adminId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RoleId:
      name: roleId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 可选规范 UUID；非法值由服务端替换
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRFToken
      in: header
      required: true
      description: 从 xianwen_csrf Cookie 读取的 CSRF Token
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationError:
      description: 参数校验失败
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BusinessConflict:
      description: 业务状态冲突、额度不足或超限
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ApprovalStateConflict:
      description: 当前审核状态不允许此操作
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AccountStateConflict:
      description: 当前账号状态不允许此操作
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AuthCredentialsInvalid:
      description: 手机号或短信验证码不正确
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AccountAlreadyExists:
      description: 有效注册验证码已消费，但手机号已经注册
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationOrVerificationError:
      description: 表单校验失败，或验证码不正确/已失效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AuthRequired:
      description: 未认证或认证凭证无效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PermissionDenied:
      description: 权限不足
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CsrfFailed:
      description: CSRF 验证失败
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResourceNotFound:
      description: 资源不存在或不可访问
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MethodNotAllowed:
      description: 请求方法不允许
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidJson:
      description: JSON 请求体无法解析
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: 请求频率超过限制
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 服务器内部错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: 数据库或 Redis 不可用
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    EnvelopeBase:
      type: object
      required: [success, request_id]
      properties:
        success: {type: boolean}
        request_id: {type: string, format: uuid}
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [error]
          properties:
            success:
              type: boolean
              const: false
            error:
              type: object
              required: [code, message, details]
              properties:
                code:
                  $ref: '#/components/schemas/ErrorCode'
                message: {type: string}
                details: {type: object, additionalProperties: true}
    ErrorCode:
      type: string
      enum:
        - AUTH_REQUIRED
        - AUTH_CREDENTIALS_INVALID
        - ACCOUNT_UNAVAILABLE
        - ADMIN_LOGIN_REQUIRED
        - ADMIN_AUTH_CHALLENGE_INVALID
        - ADMIN_AUTH_CHALLENGE_EXPIRED
        - ADMIN_IP_NOT_ALLOWED
        - ADMIN_REAUTH_FAILED
        - SECURITY_POLICY_VERSION_CONFLICT
        - IP_ALLOWLIST_LOCKOUT_CONFIRMATION_REQUIRED
        - ACCOUNT_ALREADY_EXISTS
        - APPROVAL_STATE_CONFLICT
        - ACCOUNT_STATE_CONFLICT
        - APPROVAL_REASON_REQUIRED
        - PERMISSION_DENIED
        - CSRF_FAILED
        - RESOURCE_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - INVALID_JSON
        - VALIDATION_ERROR
        - VERIFICATION_CODE_INVALID
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_TEMPORARILY_UNAVAILABLE
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: object
              required: [status]
              properties:
                status: {type: string, const: ok}
    CsrfEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [csrf_token]
              properties:
                csrf_token: {type: string}
    SmsPurpose:
      type: string
      enum: [register, login, password_reset]
    SmsSendRequest:
      type: object
      additionalProperties: false
      required: [phone, purpose]
      properties:
        phone:
          type: string
          description: 中国大陆手机号；允许 +86、0086、空格和短横线等价格式
          examples: ['13800138000', '+8613800138000']
        purpose:
          $ref: '#/components/schemas/SmsPurpose'
    SmsSendEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: object
              additionalProperties: false
              required: [sent, expires_in, resend_after]
              properties:
                sent: {type: boolean, const: true}
                expires_in: {type: integer, const: 300}
                resend_after: {type: integer, const: 60}
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [phone, nickname, sms_code, password]
      properties:
        phone:
          type: string
          description: 中国大陆手机号，允许 +86、0086、空格和短横线等价格式
        nickname: {type: string, minLength: 1, maxLength: 50}
        sms_code: {type: string, pattern: '^\d{6}$'}
        password: {type: string, minLength: 10, maxLength: 128, format: password}
    SmsLoginRequest:
      type: object
      additionalProperties: false
      required: [phone, sms_code]
      properties:
        phone:
          type: string
          description: 中国大陆手机号，允许 +86、0086、空格和短横线等价格式
        sms_code: {type: string, pattern: '^\d{6}$'}
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [phone, sms_code, new_password]
      properties:
        phone:
          type: string
          description: 中国大陆手机号，允许 +86、0086、空格和短横线等价格式
        sms_code: {type: string, pattern: '^\d{6}$'}
        new_password: {type: string, minLength: 10, maxLength: 128, format: password}
    PasswordResetEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: object
              additionalProperties: false
              required: [reset]
              properties:
                reset: {type: boolean, const: true}
    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        phone:
          type: string
          description: 中国大陆手机号，允许 +86、0086、空格和短横线等价格式
          examples: ['13800138000', '+8613800138000']
        password: {type: string, minLength: 10, maxLength: 128, format: password}
    LogoutEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [logged_out]
              properties:
                logged_out: {type: boolean, const: true}
    User:
      type: object
      required: [id, phone_masked, nickname, approval_status, account_status]
      properties:
        id: {type: string, format: uuid}
        phone_masked: {type: string}
        nickname: {type: string}
        approval_status:
          $ref: '#/components/schemas/ApprovalStatus'
        account_status:
          $ref: '#/components/schemas/AccountStatus'
        approval_reason: {type: [string, 'null'], maxLength: 500}
    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected]
    AccountStatus:
      type: string
      enum: [active, frozen, cancel_pending, cancelled]
    ApprovalResubmitRequest:
      type: object
      additionalProperties: false
      properties:
        nickname: {type: string, minLength: 1, maxLength: 50}
    AdminUser:
      type: object
      additionalProperties: false
      required:
        [id, nickname, phone_masked, approval_status, account_status, approved_at, created_at]
      properties:
        id: {type: string, format: uuid}
        nickname: {type: string, maxLength: 50}
        phone_masked: {type: string, example: '+86 138****8000'}
        approval_status:
          $ref: '#/components/schemas/ApprovalStatus'
        account_status:
          $ref: '#/components/schemas/AccountStatus'
        approval_reason: {type: [string, 'null'], maxLength: 500}
        approved_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    Pagination:
      type: object
      additionalProperties: false
      required: [page, page_size, count, total_pages]
      properties:
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        count: {type: integer, minimum: 0}
        total_pages: {type: integer, minimum: 0}
    AdminUserEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success: {type: boolean, const: true}
            data:
              $ref: '#/components/schemas/AdminUser'
    AdminUserPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success: {type: boolean, const: true}
            data:
              type: object
              additionalProperties: false
              required: [results, pagination]
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminUser'
                pagination:
                  $ref: '#/components/schemas/Pagination'
    UserStatusEvent:
      type: object
      additionalProperties: false
      required:
        [id, status_domain, event_type, from_value, to_value, reason, actor_id, request_id, created_at]
      properties:
        id: {type: string, format: uuid}
        status_domain: {type: string, enum: [approval, account]}
        event_type: {type: string, enum: [approved, rejected, resubmitted, frozen, unfrozen]}
        from_value: {type: string}
        to_value: {type: string}
        reason: {type: string, maxLength: 500}
        actor_id: {type: [string, 'null'], format: uuid}
        request_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    UserStatusEventPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success: {type: boolean, const: true}
            data:
              type: object
              additionalProperties: false
              required: [results, pagination]
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/UserStatusEvent'
                pagination:
                  $ref: '#/components/schemas/Pagination'
    ReviewUserRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [decision]
          properties:
            decision: {type: string, const: approve}
            reason: {type: string, maxLength: 500}
        - type: object
          additionalProperties: false
          required: [decision, reason]
          properties:
            decision: {type: string, const: reject}
            reason: {type: string, minLength: 1, maxLength: 500}
    AccountStatusActionRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 500}
    Notification:
      type: object
      additionalProperties: false
      required: [id, notification_type, title, safe_summary, read_at, created_at]
      properties:
        id: {type: string, format: uuid}
        notification_type:
          type: string
          enum: [approval_approved, approval_rejected, account_frozen, account_unfrozen]
        title: {type: string, maxLength: 100}
        safe_summary:
          type: string
          maxLength: 200
          description: 固定安全模板，不包含拒绝原因正文。
        read_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    NotificationEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success: {type: boolean, const: true}
            data:
              $ref: '#/components/schemas/Notification'
    NotificationPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success: {type: boolean, const: true}
            data:
              type: object
              additionalProperties: false
              required: [results, pagination]
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/Notification'
                pagination:
                  $ref: '#/components/schemas/Pagination'
    CreateSubjectRequest:
      type: object
      required: [subject_type_id, name]
      properties:
        subject_type_id: {type: string, format: uuid}
        name: {type: string}
        fields: {type: object, additionalProperties: true}
    KeywordGenerationRequest:
      type: object
      required: [target_count]
      properties:
        target_count: {type: integer, minimum: 1}
        include_short: {type: boolean, default: false}
        include_long_tail: {type: boolean, default: false}
        include_regional: {type: boolean, default: false}
        regions:
          type: array
          items: {type: string}
        regenerate: {type: boolean, default: false}
    GeoDetectionSelection:
      type: object
      required: [question_ids, model_ids]
      properties:
        question_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, format: uuid}
        model_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, format: uuid}
    GeoEstimateEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                question_count: {type: integer}
                model_count: {type: integer}
                required_detection_points: {type: integer}
                available_detection_points: {type: integer}
                can_submit: {type: boolean}
    AsyncTask:
      type: object
      properties:
        id: {type: string, format: uuid}
        type: {type: string}
        status:
          type: string
          enum: [draft, queued, running, reviewing, partial, succeeded, failed, cancelled, expired]
        progress: {type: integer, minimum: 0, maximum: 100}
        result_id: {type: [string, 'null'], format: uuid}
        user_message: {type: string}
        quota:
          type: object
          properties:
            type: {type: string}
            frozen: {type: integer}
            deducted: {type: integer}
            refunded: {type: integer}
    TaskEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AsyncTask'
    AdminPasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        phone: {type: string}
        password: {type: string, format: password, writeOnly: true}
    AdminPasswordLoginEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: object
              required: [requires_2fa]
              properties:
                requires_2fa: {type: boolean}
