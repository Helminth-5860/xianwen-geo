      summary: 查询当前超级管理员强制 2FA 与 IP 白名单策略
      responses: {'200': {description: 超级管理员安全策略}, '403': {$ref: '#/components/responses/PermissionDenied'}, '500': {$ref: '#/components/responses/InternalError'}}
    patch:
      tags: [Admin]
