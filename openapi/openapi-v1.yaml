      tags: [Admin]
      summary: 查询角色 IP 白名单条目
      responses: {'200': {description: 角色 IP 白名单条目}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '500': {$ref: '#/components/responses/InternalError'}}
    post:
      tags: [Admin]
      summary: 新增或恢复角色 CIDR 条目
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IpAllowlistCreateRequest'}}}}
      responses: {'201': {description: 角色 CIDR 条目已保存}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {description: 安全策略版本冲突或锁出确认缺失}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}, '500': {$ref: '#/components/responses/InternalError'}}
  /admin/roles/{roleId}/ip-allowlist/{entryId}:
    parameters: [{$ref: '#/components/parameters/RoleId'}, {name: entryId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      tags: [Admin]
      summary: 更新角色 CIDR 条目状态；不物理删除
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IpAllowlistUpdateRequest'}}}}
      responses: {'200': {description: 角色 CIDR 条目已更新}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {description: 安全策略版本冲突或锁出确认缺失}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}, '500': {$ref: '#/components/responses/InternalError'}}
  /admin/security/superuser:
    get:
