    post: {tags: [Admin, Articles], summary: 记录文章人工审核决定；系统责任仅生成补偿待办，不直接改额度, parameters: [{$ref: '#/components/parameters/CsrfToken'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModerationDecisionRequest'}}}}, responses: {'200': {description: 审核决定已记录}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/BusinessConflict'}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /admin/moderation/images/{imageId}/decision:
    parameters: [{name: imageId, in: path, required: true, schema: {type: string, format: uuid}}]
    post: {tags: [Admin, Images], summary: 记录图片人工审核决定；系统责任仅生成补偿待办，不直接改额度, parameters: [{$ref: '#/components/parameters/CsrfToken'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModerationDecisionRequest'}}}}, responses: {'200': {description: 审核决定已记录}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/BusinessConflict'}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /admin/announcements:
    get: {tags: [Admin], summary: 分页获取公告, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {description: 公告列表, content: {application/json: {schema: {$ref: '#/components/schemas/Stage3ObjectEnvelope'}}}}, '403': {$ref: '#/components/responses/PermissionDenied'}}}
    post: {tags: [Admin], summary: 创建草稿公告, parameters: [{$ref: '#/components/parameters/CsrfToken'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnnouncementWriteRequest'}}}}, responses: {'201': {description: 公告已创建}, '403': {$ref: '#/components/responses/PermissionDenied'}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /admin/announcements/{announcementId}/action:
    parameters: [{name: announcementId, in: path, required: true, schema: {type: string, format: uuid}}]
    post: {tags: [Admin], summary: 发布或停用公告, parameters: [{$ref: '#/components/parameters/CsrfToken'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnnouncementActionRequest'}}}}, responses: {'200': {description: 公告状态已更新}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/BusinessConflict'}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /admin/feedback:
    get: {tags: [Admin], summary: 按数据范围分页获取用户反馈, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {name: status, in: query, schema: {type: string, enum: [open, replied, closed]}}], responses: {'200': {description: 用户反馈, content: {application/json: {schema: {$ref: '#/components/schemas/Stage3ObjectEnvelope'}}}}, '403': {$ref: '#/components/responses/PermissionDenied'}}}
  /admin/feedback/{feedbackId}/action:
    parameters: [{name: feedbackId, in: path, required: true, schema: {type: string, format: uuid}}]
    post: {tags: [Admin], summary: 回复或关闭用户反馈, parameters: [{$ref: '#/components/parameters/CsrfToken'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FeedbackActionRequest'}}}}, responses: {'200': {description: 反馈状态已更新}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/BusinessConflict'}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /admin/users/{customerId}/support-view-request:
    parameters: [{name: customerId, in: path, required: true, schema: {type: string, format: uuid}}]
    post: {tags: [Admin], summary: 请求有时限的客户只读协助查看；forced 仅限冻结的高权限路径, parameters: [{$ref: '#/components/parameters/CsrfToken'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SupportViewCreateRequest'}}}}, responses: {'202': {description: 协助查看请求已创建}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /admin/support-view-sessions/{supportId}/summary:
    parameters: [{name: supportId, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {tags: [Admin], summary: 读取已授权的最小只读客户摘要并追加不可变访问审计, responses: {'200': {description: 不含手机号、正文、提示词、密钥或供应商原始响应的摘要, content: {application/json: {schema: {$ref: '#/components/schemas/Stage3ObjectEnvelope'}}}}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}}}
  /admin/release-readiness:
    get: {tags: [Admin, System], summary: 获取 fail-closed 发布就绪安全摘要；外部证据缺失时为 NOT_READY, responses: {'200': {description: 不含密钥和原始配置的发布就绪状态, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseReadinessEnvelope'}}}}, '403': {$ref: '#/components/responses/PermissionDenied'}}}
  /admin/system-alerts:
    get: {tags: [Admin, System], summary: 分页获取去重后的系统告警安全摘要, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {description: 系统告警, content: {application/json: {schema: {$ref: '#/components/schemas/Stage3ObjectEnvelope'}}}}, '403': {$ref: '#/components/responses/PermissionDenied'}}}
  /admin/system-alerts/{alertId}/action:
    parameters: [{name: alertId, in: path, required: true, schema: {type: string, format: uuid}}]
    post: {tags: [Admin, System], summary: 以 expected_version 确认或解决系统告警并追加审计, parameters: [{$ref: '#/components/parameters/CsrfToken'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SystemAlertActionRequest'}}}}, responses: {'200': {description: 告警状态已更新}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/BusinessConflict'}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /admin/backups:
    get: {tags: [Admin, System], summary: 分页获取备份及恢复验证证据，不暴露存储凭据, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {description: 备份验证记录, content: {application/json: {schema: {$ref: '#/components/schemas/Stage3ObjectEnvelope'}}}}, '403': {$ref: '#/components/responses/PermissionDenied'}}}
  /admin/retention-jobs:
    get: {tags: [Admin, System], summary: 分页获取数据保留任务安全摘要, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {description: 数据保留任务, content: {application/json: {schema: {$ref: '#/components/schemas/Stage3ObjectEnvelope'}}}}, '403': {$ref: '#/components/responses/PermissionDenied'}}}
components:
  pathItems:
    AdminStatusAction:
      parameters:
        - $ref: '#/components/parameters/AdminId'
      post:
        tags: [Admin]
        summary: 管理员状态转换
        parameters:
          - $ref: '#/components/parameters/CsrfToken'
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExpectedVersionRequest'}
        responses:
          '200': {description: 状态已更新}
          '409': {description: ADMIN_STATE_CONFLICT、ADMIN_VERSION_CONFLICT、ADMIN_HAS_ASSIGNED_CUSTOMERS 或 LAST_SUPERUSER_PROTECTED}
    PlanStateAction:
      parameters: [{$ref: '#/components/parameters/PlanId'}]
      post:
        tags: [Admin, Plans]
        summary: 套餐状态动作（online/offline/archive）
        parameters: [{$ref: '#/components/parameters/CsrfToken'}]
        requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanExpectedVersionRequest'}}}}
        responses: {'200': {description: 已执行并写入操作记录}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}}
    PlanVersionStateAction:
      parameters: [{$ref: '#/components/parameters/PlanVersionId'}]
      post:
        tags: [Admin, Plans]
        summary: 退役套餐版本；已发布/retired 权益不可变
        parameters: [{$ref: '#/components/parameters/CsrfToken'}]
        requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanExpectedVersionRequest'}}}}
        responses: {'200': {description: 已执行并写入操作记录}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}}
    PlanVersionPublishAction:
      parameters: [{$ref: '#/components/parameters/PlanVersionId'}]
      post:
        tags: [Admin, Plans]
        summary: 发布服务端 canonical snapshot
        parameters: [{$ref: '#/components/parameters/CsrfToken'}]
        requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanPublishRequest'}}}}
        responses: {'200': {description: 已发布并写入操作记录}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}}
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: xianwen_session
  headers:
    RequestId:
      description: 本次请求的规范 UUID；与响应体 request_id 完全一致
      required: true
      schema:
        type: string
        format: uuid
  parameters:
    PlanId:
      name: planId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlanVersionId:
      name: versionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlanApplicationId:
      name: applicationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AdminId:
      name: adminId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RoleId:
      name: roleId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SubjectVersionId:
      name: versionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 可选规范 UUID；非法值由服务端替换
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRFToken
      in: header
      required: true
      description: 从 xianwen_csrf Cookie 读取的 CSRF Token
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationError:
      description: 参数校验失败
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BusinessConflict:
      description: 业务状态冲突、额度不足或超限
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AccountStateConflict:
      description: 当前账号状态不允许此操作
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AuthCredentialsInvalid:
      description: 手机号或短信验证码不正确
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AccountAlreadyExists:
      description: 有效注册验证码已消费，但手机号已经注册
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationOrVerificationError:
      description: 表单校验失败，或验证码不正确/已失效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: PLAN_STATE_CONFLICT、PLAN_VERSION_STATE_CONFLICT、PLAN_VERSION_CONFLICT、PLAN_DRAFT_ALREADY_EXISTS 或 PLAN_IMMUTABLE
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    AuthRequired:
      description: 未认证或认证凭证无效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PermissionDenied:
      description: 权限不足
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CsrfFailed:
      description: CSRF 验证失败
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResourceNotFound:
      description: 资源不存在或不可访问
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MethodNotAllowed:
      description: 请求方法不允许
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidJson:
      description: JSON 请求体无法解析
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: 请求频率超过限制
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 服务器内部错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: 数据库或 Redis 不可用
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    EnvelopeBase:
      type: object
      required: [success, request_id]
      properties:
        success: {type: boolean}
        request_id: {type: string, format: uuid}
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [error]
          properties:
            success:
              type: boolean
              const: false
            error:
              type: object
              required: [code, message, details]
              properties:
                code:
                  $ref: '#/components/schemas/ErrorCode'
                message: {type: string}
                details: {type: object, additionalProperties: true}
    ErrorCode:
      type: string
      enum:
        - AUTH_REQUIRED
        - AUTH_CREDENTIALS_INVALID
        - CURRENT_PASSWORD_INVALID
        - PHONE_ALREADY_IN_USE
        - PHONE_CHANGE_TARGET_INVALID
        - ACCOUNT_UNAVAILABLE
        - ADMIN_LOGIN_REQUIRED
        - ADMIN_AUTH_CHALLENGE_INVALID
        - ADMIN_AUTH_CHALLENGE_EXPIRED
        - ADMIN_STEP_UP_REQUIRED
        - ADMIN_STEP_UP_EXPIRED
        - ADMIN_IP_NOT_ALLOWED
        - ADMIN_REAUTH_FAILED
        - SECURITY_POLICY_VERSION_CONFLICT
        - IP_ALLOWLIST_LOCKOUT_CONFIRMATION_REQUIRED
        - ACCOUNT_ALREADY_EXISTS
        - RISK_CONFIRMATION_REQUIRED
        - RISK_POLICY_VERSION_CONFLICT
        - RISK_SECURITY_MODE_NOT_SUPPORTED
        - RISK_SECURITY_MODE_BELOW_MINIMUM
        - RISK_TARGET_STALE
        - RISK_PAYLOAD_INVALID
        - RISK_ACTION_EXECUTION_FAILED
        - ACCOUNT_STATE_CONFLICT
        - PERMISSION_DENIED
        - CSRF_FAILED
        - RESOURCE_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - INVALID_JSON
        - VALIDATION_ERROR
        - VERIFICATION_CODE_INVALID
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_TEMPORARILY_UNAVAILABLE
        - SUBSCRIPTION_NOT_ELIGIBLE
        - SUBSCRIPTION_ALREADY_ACTIVE
        - SUBSCRIPTION_STATE_CONFLICT
        - SUBSCRIPTION_VERSION_CONFLICT
        - SUBSCRIPTION_PLAN_UNAVAILABLE
        - SUBSCRIPTION_PLAN_VERSION_MISMATCH
        - SUBSCRIPTION_TRIAL_ALREADY_GRANTED
        - SUBSCRIPTION_CONFIRMATION_REQUIRED
        - SUBSCRIPTION_OVERRIDE_FORBIDDEN
        - SUBSCRIPTION_NOTE_INVALID
        - SUBJECT_TYPE_VERSION_CONFLICT
        - SUBJECT_SCHEMA_VERSION_CONFLICT
        - SUBJECT_TYPE_KEY_CONFLICT
        - SUBJECT_FIELD_KEY_CONFLICT
        - SUBJECT_FIELD_CONFIG_INVALID
        - SUBJECT_TYPE_STATE_CONFLICT
        - SUBJECT_SCHEMA_MISMATCH
        - SUBJECT_FIELD_VALUES_INVALID
        - SUBJECT_LIMIT_REACHED
        - SUBJECT_LIMIT_RECONCILIATION_REQUIRED
        - SUBJECT_ENTITLEMENT_INTEGRITY_ERROR
        - SUBJECT_VERSION_CONFLICT
        - SUBJECT_CURRENT_VERSION_CONFLICT
        - SUBJECT_STATE_CONFLICT
        - SUBJECT_REQUIRED_FIELDS_INCOMPLETE
        - SUBJECT_SEMANTICS_INVALID
        - SUBJECT_PRODUCT_CONFIRMATION_INVALID
        - SUBJECT_VERSION_NO_CHANGES
        - SUBJECT_ENRICHMENT_IDEMPOTENCY_KEY_REQUIRED
        - SUBJECT_ENRICHMENT_STATE_CONFLICT
        - SUBJECT_ENRICHMENT_VERSION_CONFLICT
        - SUBJECT_ENRICHMENT_SOURCE_INVALID
        - SUBJECT_ENRICHMENT_TARGET_INVALID
        - SUBJECT_ENRICHMENT_INPUT_TOO_LARGE
        - SUBJECT_ENRICHMENT_INVALID_RESPONSE
        - SUBJECT_ENRICHMENT_PROVIDER_UNAVAILABLE
        - SUBJECT_ENRICHMENT_TEMPORARILY_UNAVAILABLE
        - SUBJECT_ENRICHMENT_INTERNAL_ERROR
        - KEYWORD_STATE_CONFLICT
        - KEYWORD_VERSION_CONFLICT
        - KEYWORD_SUBJECT_VERSION_CONFLICT
        - KEYWORD_VALUES_INVALID
        - KEYWORD_VERSION_NO_CHANGES
        - KEYWORD_GENERATION_STATE_CONFLICT
        - KEYWORD_GENERATION_IN_PROGRESS
        - KEYWORD_REGENERATION_CONFIRMATION_REQUIRED
        - KEYWORD_GENERATION_LIMIT_EXCEEDED
        - KEYWORD_GENERATION_CONFIG_INVALID
        - KEYWORD_GENERATION_IDEMPOTENCY_KEY_REQUIRED
        - KEYWORD_GENERATION_PROVIDER_UNAVAILABLE
        - KEYWORD_GENERATION_INVALID_RESPONSE
        - SUBJECT_RISK_CONFIG_INTEGRITY_ERROR
        - SUBJECT_RISK_CATALOG_VERSION_CONFLICT
        - SUBJECT_RISK_TYPE_VERSION_CONFLICT
        - SUBJECT_RISK_RULE_VERSION_CONFLICT
        - SUBJECT_REVIEW_STATE_CONFLICT
        - SUBJECT_REVIEW_VERSION_CONFLICT
        - SUBJECT_REVIEW_REASON_REQUIRED
        - SUBJECT_REVIEW_PENDING
        - SUBJECT_REVIEW_REJECTED
        - COMPETITOR_VALUES_INVALID
        - COMPETITOR_LIMIT_REACHED
        - COMPETITOR_DUPLICATE
        - COMPETITOR_IS_SUBJECT
        - COMPETITOR_VERSION_CONFLICT
        - COMPETITOR_NOT_FOUND
        - FILE_IDEMPOTENCY_KEY_REQUIRED
        - FILE_STATE_CONFLICT
        - FILE_VERSION_CONFLICT
        - FILE_TYPE_NOT_ALLOWED
        - FILE_SIZE_INVALID
        - FILE_CONTENT_INVALID
        - FILE_SECURITY_REJECTED
        - FILE_STORAGE_UNAVAILABLE
        - PLAN_REQUIRED
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: object
              required: [status]
              properties:
                status: {type: string, const: ok}
    CsrfEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [csrf_token]
              properties:
                csrf_token: {type: string}
    SmsPurpose:
      type: string
      enum: [register, login, password_reset]
    SmsSendRequest:
      type: object
      additionalProperties: false
      required: [phone, purpose]
      properties:
        phone:
          type: string
          description: 中国大陆手机号；允许 +86、0086、空格和短横线等价格式
          examples: ['13800138000', '+8613800138000']
        purpose:
          $ref: '#/components/schemas/SmsPurpose'
    SmsSendEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: object
              additionalProperties: false
              required: [sent, expires_in, resend_after]
              properties:
                sent: {type: boolean, const: true}
                expires_in: {type: integer, const: 300}
                resend_after: {type: integer, const: 60}
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [phone, nickname, sms_code, password]
      properties:
        phone:
