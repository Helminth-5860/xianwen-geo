      tags: [Admin]
      summary: 通过风险编排变更管理员角色
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminRoleChangeRiskRequest'}}}}
      responses:
        '200': {description: 角色已同步变更}
        '202': {description: 已创建双人审批请求, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalCreatedEnvelope'}}}}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '409': {description: 目标版本、策略或审批可用性冲突}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/roles/{roleId}/permissions:
    parameters: [{$ref: '#/components/parameters/RoleId'}]
