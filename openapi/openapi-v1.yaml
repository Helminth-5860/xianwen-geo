      tags: [Admin]
      summary: 通过固定双人审批替换角色权限
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RolePermissionsRiskRequest'}}}}
      responses:
        '200': {description: 权限已替换}
        '202': {description: 已创建双人审批请求, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalCreatedEnvelope'}}}}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '409': {description: 目标版本、策略或审批可用性冲突}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/risk-actions:
    get:
      tags: [Admin]
