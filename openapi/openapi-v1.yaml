      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ApprovalRequestStatus'}
      responses:
        '200': {description: 审批分页, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalPageEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/approvals/{approvalId}:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Admin]
      summary: 审批安全详情
      responses:
        '200': {description: 不含 sanitized_payload 全文的详情, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
  /admin/approvals/{approvalId}/approve:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Admin]
      summary: 另一名有效超级管理员批准并同步执行一次
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalApproveRequest'}}}}
      responses:
        '200': {description: 最终 executed 或 execution_failed, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {description: 自批、权限、CSRF 或当前密码失败}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {description: APPROVAL_STATE_CONFLICT 或 APPROVAL_STALE}
        '410': {description: APPROVAL_EXPIRED}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/approvals/{approvalId}/reject:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Admin]
      summary: 另一名有效超级管理员拒绝待审批请求
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalRejectRequest'}}}}
      responses:
        '200': {description: 已拒绝}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {description: 自拒绝、权限或 CSRF 失败}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {description: APPROVAL_STATE_CONFLICT}
        '410': {description: APPROVAL_EXPIRED}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/approvals/{approvalId}/cancel:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Admin]
      summary: 发起人取消待审批请求
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '200': {description: 已取消}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {description: APPROVAL_STATE_CONFLICT}
        '410': {description: APPROVAL_EXPIRED}
