        '202': {$ref: '#/components/responses/ApprovalRequired'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /quotas:
    get:
      tags: [Quotas]
      summary: Read the five account-level quotas in the current subscription window
      responses:
        '200': {description: "Excludes entitlement snapshots, idempotency digests, and business targets", content: {application/json: {schema: {$ref: '#/components/schemas/UserQuotaAccountsEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
  /quota-ledger:
    get:
      tags: [Quotas]
      summary: Read the current user's immutable quota ledger
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: "Excludes business IDs, idempotency digests, internal reasons, and actors", content: {application/json: {schema: {$ref: '#/components/schemas/UserQuotaLedgerPageEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
  /admin/quota-accounts:
    get:
      tags: [Admin, Quotas]
      summary: List quota accounts within the administrator own role or all customer scope
      parameters:
        - {name: quota_type, in: query, schema: {$ref: '#/components/schemas/QuotaType'}}
        - {name: user_id, in: query, schema: {type: string, format: uuid}}
        - {name: keyword, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Quota accounts in the authorized customer scope, content: {application/json: {schema: {$ref: '#/components/schemas/AdminQuotaAccountPageEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
  /admin/quota-ledger:
    get:
      tags: [Admin, Quotas]
      summary: List immutable quota ledger entries within customer scope
      parameters:
        - {name: account_id, in: query, schema: {type: string, format: uuid}}
        - {name: quota_type, in: query, schema: {$ref: '#/components/schemas/QuotaType'}}
        - {name: action, in: query, schema: {$ref: '#/components/schemas/QuotaLedgerAction'}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Quota ledger entries in the authorized customer scope, content: {application/json: {schema: {$ref: '#/components/schemas/AdminQuotaLedgerPageEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
  /admin/quota-accounts/{accountId}/adjust/{action}:
    parameters:
      - {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: action, in: path, required: true, schema: {type: string, enum: [grant, compensate, manual-deduct]}}
    post:
      tags: [Admin, Quotas]
      summary: Request a fixed two-person quota grant compensation or manual deduction
      description: The raw Idempotency-Key is only used to derive HMAC digests and is never persisted, logged, or stored in approval payloads.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuotaAdjustmentRequest'}}}}
      responses:
        '200': {description: Safe replay for the same Idempotency-Key and canonical request, content: {application/json: {schema: {$ref: '#/components/schemas/QuotaAdjustmentEnvelope'}}}}
        '202': {$ref: '#/components/responses/ApprovalRequired'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/subject-risk-types:
    get:
      tags: [Admin, Subjects]
      summary: List draft subject risk types
      responses: {'200': {description: Draft catalog types}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}}
    post:
      tags: [Admin, Subjects]
      summary: Create a draft subject risk type
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectRiskTypeCreateRequest'}}}}
      responses: {'201': {description: Draft type created}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/CsrfFailed'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}}
  /admin/subject-risk-types/{riskTypeId}:
    parameters: [{name: riskTypeId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      tags: [Admin, Subjects]
      summary: Update a draft subject risk type
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectRiskTypeUpdateRequest'}}}}
      responses: {'200': {description: Draft type updated}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/CsrfFailed'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /admin/subject-risk-rules:
    get:
      tags: [Admin, Subjects]
      summary: List draft subject risk rules
      responses: {'200': {description: Draft catalog rules}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}}
    post:
      tags: [Admin, Subjects]
      summary: Create a draft equals-any or contains-any rule
      description: Regex, scripts, SQL, URLs and dynamic expressions are forbidden.
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectRiskRuleCreateRequest'}}}}
      responses: {'201': {description: Draft rule created}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/CsrfFailed'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /admin/subject-risk-rules/{riskRuleId}:
    parameters: [{name: riskRuleId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      tags: [Admin, Subjects]
      summary: Update a draft subject risk rule
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectRiskRuleUpdateRequest'}}}}
      responses: {'200': {description: Draft rule updated}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/CsrfFailed'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /admin/subject-risk-catalog:
    get:
      tags: [Admin, Subjects]
      summary: Read draft version and current immutable published revision
      responses: {'200': {description: Catalog publication state, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectRiskCatalogEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}}
  /admin/subject-risk-catalog/publish:
    post:
      tags: [Admin, Subjects]
      summary: Request fixed two-person publication of the draft catalog
      description: This is the only operation that can create and activate an immutable SubjectRiskCatalogRevision.
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectRiskCatalogPublishRequest'}}}}
      responses: {'202': {description: Two-person approval requested, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalCreatedEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}}
  /admin/subject-reviews:
    get:
      tags: [Admin, Subjects]
      summary: List subject reviews within own role or all customer scope
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {name: status, in: query, schema: {$ref: '#/components/schemas/SubjectReviewStatus'}}]
      responses: {'200': {description: Scoped review page, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectReviewPageEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /admin/subject-reviews/{reviewId}:
    parameters: [{name: reviewId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Admin, Subjects]
      summary: Read a scoped subject review with safe reason categories only
      responses: {'200': {description: Review detail, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectReviewEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}}
  /admin/subject-reviews/{reviewId}/approve:
    parameters: [{name: reviewId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Admin, Subjects]
      summary: Direct single-administrator subject review approval
      description: Requires a secure administrator session, CSRF, permission, scoped object access and expected_version. It does not create an ApprovalRequest.
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectReviewDecisionRequest'}}}}
      responses: {'200': {description: Review approved, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectReviewEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/CsrfFailed'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /admin/subject-reviews/{reviewId}/reject:
    parameters: [{name: reviewId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Admin, Subjects]
      summary: Direct single-administrator subject review rejection
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectReviewDecisionRequest'}}}}
      responses: {'200': {description: Review rejected, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectReviewEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/CsrfFailed'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /subject-types:
    get:
      tags: [Subjects]
      summary: 获取启用的主体类型目录
      description: 可用账号均可读取，GET 完全只读。
      responses: {'200': {description: 启用的主体类型, content: {application/json: {schema: {$ref: '#/components/schemas/PublicSubjectTypeListEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}}
  /subject-types/{subjectTypeId}/form-schema:
    parameters: [{name: subjectTypeId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Subjects]
      summary: 获取当前只读表单 Schema
      description: 仅返回启用字段和选项；image/file 仅声明 Schema，不提供上传。
      responses: {'200': {description: 当前表单 Schema, content: {application/json: {schema: {$ref: '#/components/schemas/PublicSubjectFormSchemaEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}}
  /admin/subject-types:
    get:
      tags: [Admin, Subjects]
      summary: 查询全局主体类型目录
      parameters: [{name: status, in: query, schema: {$ref: '#/components/schemas/SubjectTypeStatus'}}, {name: keyword, in: query, schema: {type: string, maxLength: 100}}]
      responses: {'200': {description: 主体类型目录, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSubjectTypeListEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}}
    post:
      tags: [Admin, Subjects]
      summary: 创建主体类型并原子创建全部公共字段配置
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectTypeCreateRequest'}}}}
      responses: {'201': {description: 已创建, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSubjectTypeEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/CsrfFailed'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /admin/subject-types/{subjectTypeId}:
    parameters: [{name: subjectTypeId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Admin, Subjects]
      summary: 获取主体类型和全部 FieldConfig
      responses: {'200': {description: 主体类型详情, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSubjectTypeEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}}
    patch:
      tags: [Admin, Subjects]
      summary: 修改主体类型用户可见信息
      description: 不允许修改 key 或 is_builtin；同时校验 version 与 schema_version。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectTypeUpdateRequest'}}}}
      responses: {'200': {description: 已更新, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSubjectTypeEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/CsrfFailed'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /admin/subject-types/{subjectTypeId}/enable:
    parameters: [{name: subjectTypeId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Admin, Subjects]
      summary: 启用主体类型
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExpectedSubjectTypeVersions'}}}}
      responses:
        '200': {description: 状态已更新, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSubjectTypeEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/subject-types/{subjectTypeId}/disable:
    parameters: [{name: subjectTypeId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Admin, Subjects]
      summary: 停用主体类型
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExpectedSubjectTypeVersions'}}}}
      responses:
        '200': {description: 状态已更新, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSubjectTypeEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/CsrfFailed'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/subject-types/{subjectTypeId}/fields:
    parameters: [{name: subjectTypeId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Admin, Subjects]
      summary: 获取全部 FieldConfig
      responses: {'200': {description: 字段配置列表, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectFieldConfigListEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}}
    post:
      tags: [Admin, Subjects]
      summary: 原子创建 custom Definition 和 Config
      description: field_key、field_type、scope、owner 创建后不可修改。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CustomSubjectFieldCreateRequest'}}}}
      responses: {'201': {description: 字段已创建, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectFieldConfigEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/CsrfFailed'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /admin/subject-types/{subjectTypeId}/field-order:
    parameters: [{name: subjectTypeId, in: path, required: true, schema: {type: string, format: uuid}}]
    put:
      tags: [Admin, Subjects]
      summary: 原子替换完整 FieldConfig 排列
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectFieldOrderRequest'}}}}
      responses: {'200': {description: 已排序, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSubjectTypeEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/CsrfFailed'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /admin/subject-type-fields/{configId}:
    parameters: [{name: configId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      tags: [Admin, Subjects]
      summary: 修改 FieldConfig 展示和业务属性
      description: 不接受 field_key、field_type、scope、owner 或 is_builtin。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectFieldConfigUpdateRequest'}}}}
      responses: {'200': {description: 已更新, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectFieldConfigEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/CsrfFailed'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /admin/subject-type-fields/{configId}/options:
    parameters: [{name: configId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Admin, Subjects]
      summary: 为 choice FieldConfig 创建稳定 option_key
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectFieldOptionCreateRequest'}}}}
      responses: {'201': {description: 选项已创建, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectFieldOptionEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/CsrfFailed'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /admin/subject-field-options/{optionId}:
    parameters: [{name: optionId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      tags: [Admin, Subjects]
      summary: 修改选项 label、enabled 或排序
      description: option_key 不可修改，不提供 DELETE。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectFieldOptionUpdateRequest'}}}}
      responses: {'200': {description: 选项已更新, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectFieldOptionEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/CsrfFailed'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
components:
  pathItems:
    AdminStatusAction:
      parameters:
        - $ref: '#/components/parameters/AdminId'
      post:
        tags: [Admin]
        summary: 管理员状态转换
        parameters:
          - $ref: '#/components/parameters/CsrfToken'
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExpectedVersionRequest'}
        responses:
          '200': {description: 状态已更新}
          '409': {description: ADMIN_STATE_CONFLICT、ADMIN_VERSION_CONFLICT、ADMIN_HAS_ASSIGNED_CUSTOMERS 或 LAST_SUPERUSER_PROTECTED}
    PlanStateAction:
      parameters: [{$ref: '#/components/parameters/PlanId'}]
      post:
        tags: [Admin, Plans]
        summary: 套餐状态动作（online/offline/archive）
        parameters: [{$ref: '#/components/parameters/CsrfToken'}]
        requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanExpectedVersionRequest'}}}}
        responses: {'200': {description: 已执行}, '202': {$ref: '#/components/responses/ApprovalRequired'}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}}
    PlanVersionStateAction:
      parameters: [{$ref: '#/components/parameters/PlanVersionId'}]
      post:
        tags: [Admin, Plans]
        summary: 退役套餐版本；已发布/retired 权益不可变
        parameters: [{$ref: '#/components/parameters/CsrfToken'}]
        requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanExpectedVersionRequest'}}}}
        responses: {'200': {description: 已执行}, '202': {$ref: '#/components/responses/ApprovalRequired'}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}}
    PlanVersionPublishAction:
      parameters: [{$ref: '#/components/parameters/PlanVersionId'}]
      post:
        tags: [Admin, Plans]
        summary: 发布服务端 canonical snapshot
        parameters: [{$ref: '#/components/parameters/CsrfToken'}]
        requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanPublishRequest'}}}}
        responses: {'200': {description: 已发布}, '202': {$ref: '#/components/responses/ApprovalRequired'}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/PermissionDenied'}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}}
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: xianwen_session
  headers:
    RequestId:
      description: 本次请求的规范 UUID；与响应体 request_id 完全一致
      required: true
      schema:
        type: string
        format: uuid
  parameters:
    PlanId:
      name: planId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlanVersionId:
      name: versionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlanApplicationId:
      name: applicationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AdminId:
      name: adminId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RoleId:
      name: roleId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SubjectVersionId:
      name: versionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 可选规范 UUID；非法值由服务端替换
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRFToken
      in: header
      required: true
      description: 从 xianwen_csrf Cookie 读取的 CSRF Token
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationError:
      description: 参数校验失败
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BusinessConflict:
      description: 业务状态冲突、额度不足或超限
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ApprovalStateConflict:
      description: 当前审核状态不允许此操作
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AccountStateConflict:
      description: 当前账号状态不允许此操作
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AuthCredentialsInvalid:
      description: 手机号或短信验证码不正确
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AccountAlreadyExists:
      description: 有效注册验证码已消费，但手机号已经注册
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationOrVerificationError:
      description: 表单校验失败，或验证码不正确/已失效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ApprovalRequired:
      description: 高风险策略要求双人审批，原动作尚未执行
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApprovalCreatedEnvelope'}
    Conflict:
      description: PLAN_STATE_CONFLICT、PLAN_VERSION_STATE_CONFLICT、PLAN_VERSION_CONFLICT、PLAN_DRAFT_ALREADY_EXISTS 或 PLAN_IMMUTABLE
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    AuthRequired:
      description: 未认证或认证凭证无效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PermissionDenied:
      description: 权限不足
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CsrfFailed:
      description: CSRF 验证失败
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResourceNotFound:
      description: 资源不存在或不可访问
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MethodNotAllowed:
      description: 请求方法不允许
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidJson:
      description: JSON 请求体无法解析
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: 请求频率超过限制
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 服务器内部错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: 数据库或 Redis 不可用
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    EnvelopeBase:
      type: object
      required: [success, request_id]
      properties:
        success: {type: boolean}
        request_id: {type: string, format: uuid}
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [error]
          properties:
            success:
              type: boolean
              const: false
            error:
              type: object
              required: [code, message, details]
              properties:
                code:
                  $ref: '#/components/schemas/ErrorCode'
                message: {type: string}
                details: {type: object, additionalProperties: true}
    ErrorCode:
      type: string
      enum:
        - AUTH_REQUIRED
        - AUTH_CREDENTIALS_INVALID
        - ACCOUNT_UNAVAILABLE
        - ADMIN_LOGIN_REQUIRED
        - ADMIN_AUTH_CHALLENGE_INVALID
        - ADMIN_AUTH_CHALLENGE_EXPIRED
        - ADMIN_IP_NOT_ALLOWED
        - ADMIN_REAUTH_FAILED
        - SECURITY_POLICY_VERSION_CONFLICT
        - IP_ALLOWLIST_LOCKOUT_CONFIRMATION_REQUIRED
        - ACCOUNT_ALREADY_EXISTS
        - APPROVAL_STATE_CONFLICT
        - RISK_CONFIRMATION_REQUIRED
        - RISK_POLICY_VERSION_CONFLICT
        - RISK_SECURITY_MODE_NOT_SUPPORTED
        - RISK_SECURITY_MODE_BELOW_MINIMUM
        - APPROVAL_SELF_NOT_ALLOWED
        - APPROVAL_APPROVER_UNAVAILABLE
        - APPROVAL_EXPIRED
        - APPROVAL_STALE
        - APPROVAL_PAYLOAD_INVALID
        - APPROVAL_EXECUTION_FAILED
        - ACCOUNT_STATE_CONFLICT
        - APPROVAL_REASON_REQUIRED
        - PERMISSION_DENIED
        - CSRF_FAILED
        - RESOURCE_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - INVALID_JSON
        - VALIDATION_ERROR
        - VERIFICATION_CODE_INVALID
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_TEMPORARILY_UNAVAILABLE
        - SUBSCRIPTION_NOT_ELIGIBLE
        - SUBSCRIPTION_ALREADY_ACTIVE
        - SUBSCRIPTION_STATE_CONFLICT
        - SUBSCRIPTION_VERSION_CONFLICT
        - SUBSCRIPTION_PLAN_UNAVAILABLE
        - SUBSCRIPTION_PLAN_VERSION_MISMATCH
        - SUBSCRIPTION_TRIAL_ALREADY_GRANTED
        - SUBSCRIPTION_CONFIRMATION_REQUIRED
        - SUBSCRIPTION_OVERRIDE_FORBIDDEN
        - SUBSCRIPTION_NOTE_INVALID
        - SUBJECT_TYPE_VERSION_CONFLICT
        - SUBJECT_SCHEMA_VERSION_CONFLICT
        - SUBJECT_TYPE_KEY_CONFLICT
        - SUBJECT_FIELD_KEY_CONFLICT
        - SUBJECT_FIELD_CONFIG_INVALID
        - SUBJECT_TYPE_STATE_CONFLICT
        - SUBJECT_SCHEMA_MISMATCH
        - SUBJECT_FIELD_VALUES_INVALID
        - SUBJECT_LIMIT_REACHED
        - SUBJECT_LIMIT_RECONCILIATION_REQUIRED
        - SUBJECT_ENTITLEMENT_INTEGRITY_ERROR
        - SUBJECT_VERSION_CONFLICT
        - SUBJECT_CURRENT_VERSION_CONFLICT
        - SUBJECT_STATE_CONFLICT
        - SUBJECT_REQUIRED_FIELDS_INCOMPLETE
        - SUBJECT_SEMANTICS_INVALID
        - SUBJECT_PRODUCT_CONFIRMATION_INVALID
        - SUBJECT_VERSION_NO_CHANGES
        - SUBJECT_ENRICHMENT_IDEMPOTENCY_KEY_REQUIRED
        - SUBJECT_ENRICHMENT_STATE_CONFLICT
        - SUBJECT_ENRICHMENT_VERSION_CONFLICT
        - SUBJECT_ENRICHMENT_SOURCE_INVALID
        - SUBJECT_ENRICHMENT_TARGET_INVALID
        - SUBJECT_ENRICHMENT_INPUT_TOO_LARGE
        - SUBJECT_ENRICHMENT_INVALID_RESPONSE
        - SUBJECT_ENRICHMENT_PROVIDER_UNAVAILABLE
        - SUBJECT_ENRICHMENT_TEMPORARILY_UNAVAILABLE
        - SUBJECT_ENRICHMENT_INTERNAL_ERROR
        - SUBJECT_RISK_CONFIG_INTEGRITY_ERROR
        - SUBJECT_RISK_CATALOG_VERSION_CONFLICT
        - SUBJECT_RISK_TYPE_VERSION_CONFLICT
        - SUBJECT_RISK_RULE_VERSION_CONFLICT
        - SUBJECT_REVIEW_STATE_CONFLICT
        - SUBJECT_REVIEW_VERSION_CONFLICT
        - SUBJECT_REVIEW_REASON_REQUIRED
        - SUBJECT_REVIEW_PENDING
        - SUBJECT_REVIEW_REJECTED
        - FILE_IDEMPOTENCY_KEY_REQUIRED
        - FILE_STATE_CONFLICT
        - FILE_VERSION_CONFLICT
        - FILE_TYPE_NOT_ALLOWED
        - FILE_SIZE_INVALID
        - FILE_CONTENT_INVALID
        - FILE_SECURITY_REJECTED
        - FILE_STORAGE_UNAVAILABLE
        - PLAN_REQUIRED
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: object
              required: [status]
              properties:
                status: {type: string, const: ok}
    CsrfEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [csrf_token]
              properties:
                csrf_token: {type: string}
    SmsPurpose:
      type: string
      enum: [register, login, password_reset]
    SmsSendRequest:
      type: object
      additionalProperties: false
      required: [phone, purpose]
      properties:
        phone:
          type: string
          description: 中国大陆手机号；允许 +86、0086、空格和短横线等价格式
          examples: ['13800138000', '+8613800138000']
        purpose:
          $ref: '#/components/schemas/SmsPurpose'
    SmsSendEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: object
              additionalProperties: false
              required: [sent, expires_in, resend_after]
              properties:
                sent: {type: boolean, const: true}
                expires_in: {type: integer, const: 300}
                resend_after: {type: integer, const: 60}
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [phone, nickname, sms_code, password]
      properties:
        phone:
          type: string
          description: 中国大陆手机号，允许 +86、0086、空格和短横线等价格式
        nickname: {type: string, minLength: 1, maxLength: 50}
        sms_code: {type: string, pattern: '^\d{6}$'}
        password: {type: string, minLength: 10, maxLength: 128, format: password}
    SmsLoginRequest:
      type: object
      additionalProperties: false
      required: [phone, sms_code]
      properties:
        phone:
          type: string
          description: 中国大陆手机号，允许 +86、0086、空格和短横线等价格式
        sms_code: {type: string, pattern: '^\d{6}$'}
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [phone, sms_code, new_password]
      properties:
        phone:
          type: string
          description: 中国大陆手机号，允许 +86、0086、空格和短横线等价格式
        sms_code: {type: string, pattern: '^\d{6}$'}
        new_password: {type: string, minLength: 10, maxLength: 128, format: password}
    PasswordResetEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: object
              additionalProperties: false
              required: [reset]
              properties:
                reset: {type: boolean, const: true}
    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        phone:
          type: string
          description: 中国大陆手机号，允许 +86、0086、空格和短横线等价格式
          examples: ['13800138000', '+8613800138000']
        password: {type: string, minLength: 10, maxLength: 128, format: password}
    LogoutEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [logged_out]
              properties:
                logged_out: {type: boolean, const: true}
    User:
      type: object
      required: [id, phone_masked, nickname, approval_status, account_status]
      properties:
        id: {type: string, format: uuid}
        phone_masked: {type: string}
        nickname: {type: string}
        approval_status:
          $ref: '#/components/schemas/ApprovalStatus'
        account_status:
          $ref: '#/components/schemas/AccountStatus'
        approval_reason: {type: [string, 'null'], maxLength: 500}
    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected]
    AccountStatus:
      type: string
      enum: [active, frozen, cancel_pending, cancelled]
    ApprovalResubmitRequest:
      type: object
      additionalProperties: false
      properties:
        nickname: {type: string, minLength: 1, maxLength: 50}
    AdminUser:
      type: object
      additionalProperties: false
      required:
        [id, nickname, phone_masked, approval_status, account_status, status_version, approved_at, created_at]
      properties:
        id: {type: string, format: uuid}
        nickname: {type: string, maxLength: 50}
        phone_masked: {type: string, example: '+86 138****8000'}
        approval_status:
          $ref: '#/components/schemas/ApprovalStatus'
        account_status:
          $ref: '#/components/schemas/AccountStatus'
        status_version: {type: integer, minimum: 1}
        approval_reason: {type: [string, 'null'], maxLength: 500}
        approved_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    Pagination:
      type: object
      additionalProperties: false
      required: [page, page_size, count, total_pages]
      properties:
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        count: {type: integer, minimum: 0}
        total_pages: {type: integer, minimum: 0}
    AdminUserEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success: {type: boolean, const: true}
            data:
              $ref: '#/components/schemas/AdminUser'
    AdminUserPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success: {type: boolean, const: true}
            data:
              type: object
              additionalProperties: false
              required: [results, pagination]
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminUser'
                pagination:
                  $ref: '#/components/schemas/Pagination'
    UserStatusEvent:
      type: object
      additionalProperties: false
      required:
        [id, status_domain, event_type, from_value, to_value, reason, actor_id, request_id, created_at]
      properties:
        id: {type: string, format: uuid}
        status_domain: {type: string, enum: [approval, account]}
        event_type: {type: string, enum: [approved, rejected, resubmitted, frozen, unfrozen]}
        from_value: {type: string}
        to_value: {type: string}
        reason: {type: string, maxLength: 500}
        actor_id: {type: [string, 'null'], format: uuid}
        request_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    UserStatusEventPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success: {type: boolean, const: true}
            data:
              type: object
              additionalProperties: false
              required: [results, pagination]
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/UserStatusEvent'
                pagination:
                  $ref: '#/components/schemas/Pagination'
    ReviewUserRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [decision]
          properties:
            decision: {type: string, const: approve}
            reason: {type: string, maxLength: 500}
        - type: object
          additionalProperties: false
          required: [decision, reason]
          properties:
            decision: {type: string, const: reject}
            reason: {type: string, minLength: 1, maxLength: 500}
            expected_version: {type: integer, minimum: 1}
            confirmed: {type: boolean}
            current_password: {type: string, format: password, writeOnly: true}
    AccountStatusActionRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 500}
        expected_version: {type: integer, minimum: 1}
        confirmed: {type: boolean}
        current_password: {type: string, format: password, writeOnly: true}
    Notification:
      type: object
      additionalProperties: false
      required: [id, notification_type, title, safe_summary, read_at, created_at]
      properties:
        id: {type: string, format: uuid}
        notification_type:
          type: string
          enum: [approval_approved, approval_rejected, account_frozen, account_unfrozen]
        title: {type: string, maxLength: 100}
        safe_summary:
          type: string
          maxLength: 200
          description: 固定安全模板，不包含拒绝原因正文。
        read_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    NotificationEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success: {type: boolean, const: true}
            data:
              $ref: '#/components/schemas/Notification'
    NotificationPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success: {type: boolean, const: true}
            data:
              type: object
              additionalProperties: false
              required: [results, pagination]
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/Notification'
                pagination:
                  $ref: '#/components/schemas/Pagination'
    SubjectCreateRequest:
      type: object
      additionalProperties: false
      required: [subject_type_id, expected_schema_version]
      properties:
        subject_type_id: {type: string, format: uuid}
        expected_schema_version: {type: integer, minimum: 1}
        initial_values: {type: object, additionalProperties: true, default: {}}
    SubjectDraftUpdateRequest:
      type: object
      additionalProperties: false
      required: [expected_version, values]
      properties:
        expected_version: {type: integer, minimum: 1}
        values: {type: object, additionalProperties: true}
    SubjectStatusRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 1}
    SubjectCurrentRequest:
      type: object
      additionalProperties: false
      required: [subject_id, expected_version]
      properties:
        subject_id: {type: string, format: uuid}
        expected_version: {type: integer, minimum: 1}
    SubjectProductConfirmation:
      type: object
      additionalProperties: false
      required: [candidate_key, uniqueness_confirmed, include_in_mention]
      properties:
        candidate_key: {type: string, minLength: 64, maxLength: 64}
        uniqueness_confirmed: {type: boolean}
        include_in_mention: {type: boolean}
    SubjectCommitRequest:
      type: object
      additionalProperties: false
      required: [expected_version, products]
      properties:
        expected_version: {type: integer, minimum: 1}
        products:
          type: array
          items: {$ref: '#/components/schemas/SubjectProductConfirmation'}
    SubjectProductCandidate:
      type: object
      additionalProperties: false
      required: [candidate_key, display_value, source_field_key]
      properties:
        candidate_key: {type: string, minLength: 64, maxLength: 64}
        display_value: {type: string, maxLength: 500}
        source_field_key: {type: string, maxLength: 64}
    SubjectSnapshotType:
      type: object
      additionalProperties: false
      required: [id, key, name, icon_key]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        name: {type: string}
        icon_key: {type: string}
    PersistedSubjectFieldOption:
      type: object
      additionalProperties: false
      required: [option_key, label, sort_order]
      properties:
        option_key: {type: string}
        label: {type: string}
        sort_order: {type: integer, minimum: 0}
    PersistedSubjectField:
      type: object
      additionalProperties: false
      required: [field_key, field_type, scope, label, description, required, default_value, sort_order, used_for_ai, name_role, options]
      properties:
        field_key: {type: string}
        field_type: {$ref: '#/components/schemas/SubjectFieldType'}
        scope: {type: string, enum: [common, custom]}
        label: {type: string}
        description: {type: string}
        required: {type: boolean}
        default_value: {}
        sort_order: {type: integer, minimum: 0}
        used_for_ai: {type: boolean}
        name_role: {$ref: '#/components/schemas/SubjectFieldNameRole'}
        options:
          type: array
          items: {$ref: '#/components/schemas/PersistedSubjectFieldOption'}
    PersistedSubjectFormSchema:
      type: object
      additionalProperties: false
      required: [id, key, name, description, icon_key, schema_version, fields]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        name: {type: string}
        description: {type: string}
