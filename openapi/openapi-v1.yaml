      tags: [Admin]
      summary: 原子更新角色安全策略并撤销旧 Session/challenge
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleSecurityMutation'}}}}
      responses: {'200': {description: 角色安全策略已更新}, '403': {description: 权限、CSRF、密码再验证或 IP 检查失败}, '404': {$ref: '#/components/responses/ResourceNotFound'}, '409': {description: SECURITY_POLICY_VERSION_CONFLICT 或锁出确认缺失}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}, '500': {$ref: '#/components/responses/InternalError'}}
  /admin/roles/{roleId}/ip-allowlist:
