      responses: {'202': {description: 优化任务, content: {application/json: {schema: {$ref: '#/components/schemas/ArticleJobEnvelope'}}}}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /article-comparisons/{comparisonId}:
    parameters: [{name: comparisonId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Articles]
      summary: 获取短期原稿/优化稿对比
      responses: {'200': {description: 临时对比, content: {application/json: {schema: {$ref: '#/components/schemas/ArticleComparisonEnvelope'}}}}, '404': {$ref: '#/components/responses/ResourceNotFound'}}
  /article-comparisons/{comparisonId}/choose:
    parameters: [{name: comparisonId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Articles]
      summary: 选择一个当前稿并立即丢弃两份临时对比正文
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [choice], properties: {choice: {type: string, enum: [original, optimized]}}}}}}
      responses: {'200': {description: 当前文章, content: {application/json: {schema: {$ref: '#/components/schemas/ArticleEnvelope'}}}}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /articles/{articleId}/moderation:
    parameters: [{name: articleId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Articles]
      summary: 获取审核状态、不可变审核记录和一次申诉可用性
      responses: {'200': {description: 审核状态, content: {application/json: {schema: {$ref: '#/components/schemas/ArticleModerationEnvelope'}}}}, '404': {$ref: '#/components/responses/ResourceNotFound'}}
  /articles/{articleId}/moderation/appeal:
    parameters: [{name: articleId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Articles]
      summary: 提交唯一一次审核申诉
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      responses: {'202': {description: 申诉已排队}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /article-jobs/{jobId}:
    parameters: [{name: jobId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Articles]
      summary: 获取本人文章任务安全状态；不返回原始 provider JSON
      responses: {'200': {description: 任务, content: {application/json: {schema: {$ref: '#/components/schemas/ArticleJobEnvelope'}}}}, '404': {$ref: '#/components/responses/ResourceNotFound'}}
  /publishing-channels:
    get:
      tags: [Publishing]
      summary: 获取官方导航及当前不可变渠道模板；actual_publishing_supported 固定为 false
      responses: {'200': {description: 渠道目录, content: {application/json: {schema: {$ref: '#/components/schemas/PublishingChannelListEnvelope'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}}
  /articles/{articleId}/channel-adaptations:
    parameters: [{name: articleId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Publishing]
      summary: 获取独立渠道适配稿
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: 渠道稿分页, content: {application/json: {schema: {$ref: '#/components/schemas/ChannelAdaptationListEnvelope'}}}}}
    post:
      tags: [Publishing]
      summary: 批量创建相互独立的渠道适配任务
      description: 每个成功渠道稿消费 1 文章额度，各渠道失败单独释放；不登录或发布第三方平台。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChannelBatchRequest'}}}}
      responses: {'202': {description: 渠道任务, content: {application/json: {schema: {$ref: '#/components/schemas/ChannelAdaptationBatchEnvelope'}}}}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /channel-adaptation-jobs/{jobId}:
    parameters: [{name: jobId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Publishing]
      summary: 获取渠道适配任务
      responses: {'200': {description: 渠道任务, content: {application/json: {schema: {$ref: '#/components/schemas/ArticleJobEnvelope'}}}}, '404': {$ref: '#/components/responses/ResourceNotFound'}}
  /channel-adaptations/{adaptationId}:
    parameters: [{name: adaptationId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Publishing]
      summary: 获取本人渠道稿
      responses: {'200': {description: 渠道稿, content: {application/json: {schema: {$ref: '#/components/schemas/ChannelAdaptationEnvelope'}}}}, '404': {$ref: '#/components/responses/ResourceNotFound'}}
    patch:
      tags: [Publishing]
      summary: 乐观锁编辑渠道稿
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChannelAdaptationUpdateRequest'}}}}
      responses: {'200': {description: 已更新渠道稿, content: {application/json: {schema: {$ref: '#/components/schemas/ChannelAdaptationEnvelope'}}}}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /publication-checks:
    post:
      tags: [Publishing]
      summary: 对公开 HTTP(S) 链接执行一次 SSRF-safe 内容匹配
      description: 仅返回 success、failed 或 unknown，不创建定时任务且不声称系统已发布。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublicationCheckRequest'}}}}
      responses: {'201': {description: 即时检测记录, content: {application/json: {schema: {$ref: '#/components/schemas/PublicationCheckEnvelope'}}}}, '422': {$ref: '#/components/responses/ValidationError'}}
  /publication-checks/{checkId}:
    parameters: [{name: checkId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Publishing]
      summary: 获取本人不可变即时检测记录
      responses: {'200': {description: 检测记录, content: {application/json: {schema: {$ref: '#/components/schemas/PublicationCheckEnvelope'}}}}, '404': {$ref: '#/components/responses/ResourceNotFound'}}
  /subjects/{subjectId}/publication-checks:
    parameters: [{$ref: '#/components/parameters/SubjectId'}]
    get:
      tags: [Publishing]
      summary: 获取主体即时检测记录分页
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: 检测记录分页, content: {application/json: {schema: {$ref: '#/components/schemas/PublicationCheckPageEnvelope'}}}}, '404': {$ref: '#/components/responses/ResourceNotFound'}}
  /articles/{articleId}/exports:
    parameters: [{name: articleId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Articles]
      summary: 导出已通过审核的当前稿为 Word、PDF、TXT、Markdown 或 HTML
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArticleExportRequest'}}}}
      responses: {'201': {description: 短期私有下载地址, content: {application/json: {schema: {$ref: '#/components/schemas/ArticleExportEnvelope'}}}}, '409': {$ref: '#/components/responses/BusinessConflict'}, '503': {$ref: '#/components/responses/ServiceUnavailable'}}
  /geo/reports/{reportId}/exports:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Reports]
      summary: 生成 PDF、Word 或 Excel
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GeoReportExportRequest'}
      responses:
        '202':
          description: 报告导出任务已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GeoReportExportCreatedEnvelope'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /report-exports/{exportId}:
    parameters:
      - name: exportId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Reports]
      summary: 获取导出任务状态和未过期的短期下载地址
      responses:
        '200':
          description: 导出任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GeoReportExportEnvelope'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
  /geo/reports/{reportId}/shares:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Reports]
      summary: 获取本人报告分享列表；永不返回 token 或 token digest
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: 分享列表, content: {application/json: {schema: {$ref: '#/components/schemas/ReportShareListEnvelope'}}}}, '404': {$ref: '#/components/responses/ResourceNotFound'}}
    post:
      tags: [Reports]
      summary: 创建冻结完整报告与品牌快照的分享链接
      description: 原始高熵 token 仅在创建 URL 中返回一次；数据库仅保存 HMAC digest，可选密码只保存哈希。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReportShareCreateRequest'}}}}
      responses:
        '201': {description: 分享创建成功, content: {application/json: {schema: {$ref: '#/components/schemas/ReportShareCreatedEnvelope'}}}}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /subjects/{subjectId}/white-label:
    parameters: [{$ref: '#/components/parameters/SubjectId'}]
    get:
      tags: [Reports]
      summary: 获取主体默认或套餐白标配置
      responses: {'200': {description: 有效品牌配置, content: {application/json: {schema: {$ref: '#/components/schemas/WhiteLabelEnvelope'}}}}, '404': {$ref: '#/components/responses/ResourceNotFound'}}
    put:
      tags: [Reports]
      summary: 乐观锁保存有权益的主体白标配置
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WhiteLabelUpdateRequest'}}}}
      responses: {'200': {description: 已保存配置, content: {application/json: {schema: {$ref: '#/components/schemas/WhiteLabelEnvelope'}}}}, '403': {$ref: '#/components/responses/PermissionDenied'}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /report-shares/{shareId}:
    parameters: [{name: shareId, in: path, required: true, schema: {type: string, format: uuid}}]
    delete:
      tags: [Reports]
      summary: 关闭本人分享；关闭不可逆且不物理删除证据
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      responses: {'200': {description: 已关闭分享, content: {application/json: {schema: {$ref: '#/components/schemas/ReportShareEnvelope'}}}}, '404': {$ref: '#/components/responses/ResourceNotFound'}}
  /public/report-shares/{token}:
    parameters: [{name: token, in: path, required: true, schema: {type: string, minLength: 32, maxLength: 100, writeOnly: true}}]
    get:
      security: []
      tags: [Reports]
      summary: 匿名读取冻结分享；密码保护时先返回最小锁定摘要
      responses: {'200': {description: 锁定摘要或完整冻结快照, content: {application/json: {schema: {$ref: '#/components/schemas/PublicReportShareEnvelope'}}}}, '410': {description: 分享已过期或关闭}}
  /public/report-shares/{token}/unlock:
    parameters: [{name: token, in: path, required: true, schema: {type: string, minLength: 32, maxLength: 100, writeOnly: true}}]
    post:
      security: []
      tags: [Reports]
      summary: 限速验证分享密码并设置 HttpOnly、SameSite=Lax 短期 Cookie
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [password], properties: {password: {type: string, format: password, maxLength: 128, writeOnly: true}}}}}}
      responses: {'200': {description: 已解锁}, '403': {$ref: '#/components/responses/PermissionDenied'}, '410': {description: 分享已过期或关闭}, '429': {$ref: '#/components/responses/RateLimited'}}
  /public/report-shares/{token}/pdf:
    parameters: [{name: token, in: path, required: true, schema: {type: string, minLength: 32, maxLength: 100, writeOnly: true}}]
    get:
      security: []
      tags: [Reports]
      summary: 对已解锁的冻结报告与品牌快照生成私有 PDF 下载地址
      responses: {'200': {description: 短期下载地址, content: {application/json: {schema: {$ref: '#/components/schemas/ArticleExportEnvelope'}}}}, '403': {$ref: '#/components/responses/PermissionDenied'}, '410': {description: 分享已过期或关闭}, '503': {$ref: '#/components/responses/ServiceUnavailable'}}
  /admin/users:
    get:
      tags: [Admin]
      summary: 管理员用户列表
      description: 仅有效 staff 可访问；完整手机号只用于精确筛选，响应始终脱敏。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: account_status
          in: query
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - name: phone
          in: query
          description: 完整手机号，规范化后精确匹配；不会写入请求日志。
          schema: {type: string}
      responses:
        '200':
          description: 稳定按 created_at、id 排序的用户分页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPageEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      summary: 管理员查看用户详情
      responses:
        '200':
          description: 用户最小详情和账号状态
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /admin/users/{userId}/history:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      summary: 用户账号状态追加式历史
      description: 普通 API 只读，不提供更新或删除操作。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 状态历史分页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatusEventPageEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/users/{userId}/freeze:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      summary: 冻结 active 用户并撤销全部旧 Session
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountStatusActionRequest'
      responses:
        '200':
          description: 用户已冻结，旧 Session 下一次访问均按匿名处理
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/AccountStateConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/users/{userId}/unfreeze:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      summary: 解冻 frozen 用户，不恢复任何旧 Session
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountStatusActionRequest'
      responses:
        '200':
          description: 用户已解冻，必须重新登录
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/AccountStateConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/users/{userId}/test-account:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      summary: 超级管理员开启或关闭内部测试账号
      description: 仅改变商业套餐与额度限制；不绕过登录、安全、权限或数据隔离。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestAccountActionRequest'
      responses:
        '200':
          description: 测试账号状态已更新并写入操作记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/api-credentials:
    get:
      tags: [Admin]
      summary: API 密钥掩码列表，仅超级管理员
      responses:
        '200': {description: 只返回当前启用版本的掩码和状态, content: {application/json: {schema: {$ref: '#/components/schemas/APICredentialListEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
    post:
      tags: [Admin]
      summary: 新增 API 密钥；明文仅存在于请求调用栈
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/APICredentialCreateRequest'}}}}
      responses:
        '201': {description: 已加密保存并仅返回掩码, content: {application/json: {schema: {$ref: '#/components/schemas/APICredentialEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '409': {$ref: '#/components/responses/AccountStateConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/api-credentials/{credentialId}/rotate:
    post:
      tags: [Admin]
      summary: 轮换 API 密钥；旧密文在本地记录中擦除
      parameters:
        - {name: credentialId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/APICredentialRotateRequest'}}}}
      responses:
        '200': {description: 轮换完成, content: {application/json: {schema: {$ref: '#/components/schemas/APICredentialEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/AccountStateConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/api-credentials/{credentialId}/test:
    post:
      tags: [Admin]
      summary: 检查密钥安全存储/解密边界；XW-0403 不执行真实 Provider 网络验证
      parameters:
        - {name: credentialId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/APICredentialTestRequest'}}}}
      responses:
        '200': {description: 本地安全存储检查通过；remote_validated 固定为 false, content: {application/json: {schema: {$ref: '#/components/schemas/APICredentialTestEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/AccountStateConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /admin/auth/login/password:
    post:
      tags: [Admin]
      security: []
      summary: 管理员密码认证并直接建立后台 Session；不会创建或发送短信 challenge
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminPasswordLoginRequest'}}}}
      responses:
        '200': {description: 管理员密码 Session 已建立，requires_2fa 固定为 false 以兼容旧客户端, content: {application/json: {schema: {$ref: '#/components/schemas/AdminPasswordLoginEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {description: CSRF 失败、管理员入口限制或 IP 不允许}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/auth/step-up/challenge:
    post:
      tags: [Admin]
