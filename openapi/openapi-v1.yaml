    get:
      tags: [Admin]
      summary: 超级管理员查看统一安全审计索引
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - {name: action_key, in: query, schema: {type: string, maxLength: 100}}
        - {name: outcome, in: query, schema: {type: string, maxLength: 32}}
      responses:
        '200': {description: 仅白名单安全摘要, content: {application/json: {schema: {$ref: '#/components/schemas/AuditEventPageEnvelope'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
  /admin/audit-events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Admin]
      summary: 超级管理员查看统一审计安全详情
      responses:
        '200': {description: 不含完整 payload、手机号、IP 或原始异常, content: {application/json: {schema: {$ref: '#/components/schemas/AuditEventEnvelope'}}}}
