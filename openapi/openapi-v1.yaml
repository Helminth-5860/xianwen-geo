openapi: 3.1.0
info:
  title: 显问 GEO 智能体系统 API
  version: 1.0.0
  description: |
    V1 API 启动骨架。实现过程中必须持续补全 schemas、examples、权限和错误响应。
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: System
  - name: Auth
  - name: Me
  - name: Plans
  - name: Subjects
  - name: Documents
  - name: Keywords
  - name: Questions
  - name: GEO
  - name: Articles
  - name: Images
  - name: Publishing
  - name: Reports
  - name: Assistant
  - name: Admin
paths:
  /health:
    get:
      tags: [System]
      security: []
      summary: 服务及依赖健康检查
      responses:
        '200':
          description: API、数据库和 Redis 均可用
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
              example:
                success: true
                data:
                  status: ok
                request_id: 24c5291c-9172-49e5-a970-d3a41426dff3
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/csrf:
    get:
      tags: [Auth]
      security: []
      summary: 获取用于会话认证写请求的 CSRF Token
      responses:
        '200':
          description: CSRF Token 已生成，并设置可由前端读取的 xianwen_csrf Cookie
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: xianwen_csrf Cookie；production 使用 Secure
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfEnvelope'
  /auth/login/password:
    post:
      tags: [Auth]
      security: []
      summary: 中国大陆手机号与密码登录
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: 登录成功，建立最长 12 小时的浏览器会话
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: HttpOnly xianwen_session Cookie
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出当前会话
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 当前会话已失效
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
  /me:
    get:
      tags: [Me]
      summary: 当前用户的最小账号状态
      responses:
        '200':
          description: 当前用户信息
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/AuthRequired'
  /plans:
    get:
      tags: [Plans]
      security: []
      summary: 展示套餐列表
      responses:
        '200':
          description: 套餐列表
  /package-applications:
    post:
      tags: [Plans]
      summary: 申请开通套餐
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: {type: string, format: uuid}
                contact_name: {type: string}
                contact_phone: {type: string}
                note: {type: string}
      responses:
        '201': {description: 已提交}
  /subjects:
    get:
      tags: [Subjects]
      summary: 主体列表
      responses:
        '200': {description: 主体列表}
    post:
      tags: [Subjects]
      summary: 创建主体草稿
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubjectRequest'
      responses:
        '201': {description: 创建成功}
        '409':
          $ref: '#/components/responses/BusinessConflict'
  /subjects/{subjectId}:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      tags: [Subjects]
      summary: 当前主体详情
      responses:
        '200': {description: 主体详情}
        '404': {description: 不存在或无权访问}
  /subjects/{subjectId}/commit:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    post:
      tags: [Subjects]
      summary: 校验草稿并创建主体资料版本
      responses:
        '201': {description: 新资料版本}
        '422':
          $ref: '#/components/responses/ValidationError'
  /subjects/{subjectId}/keywords/generate:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Keywords]
      summary: 生成关键词
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeywordGenerationRequest'
      responses:
        '202':
          description: 关键词生成任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '409':
          $ref: '#/components/responses/BusinessConflict'
  /subjects/{subjectId}/distillations:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Keywords]
      summary: 发起关键词蒸馏
      responses:
        '202':
          description: 关键词蒸馏任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /subjects/{subjectId}/question-banks/generate:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Questions]
      summary: 生成问题库
      responses:
        '202':
          description: 问题库生成任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /subjects/{subjectId}/geo/estimate:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    post:
      tags: [GEO]
      summary: 估算检测点
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoDetectionSelection'
      responses:
        '200':
          description: 估算结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoEstimateEnvelope'
  /subjects/{subjectId}/geo/detections:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [GEO]
      summary: 创建 GEO 检测任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoDetectionSelection'
      responses:
        '202':
          description: GEO 检测任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '409':
          $ref: '#/components/responses/BusinessConflict'
  /geo/detections/{detectionId}:
    parameters:
      - name: detectionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [GEO]
      summary: 检测任务进度
      responses:
        '200':
          description: 检测任务当前进度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /geo/detections/{detectionId}/cancel:
    parameters:
      - name: detectionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [GEO]
      summary: 取消尚未开始的调用
      responses:
        '200': {description: 已受理取消}
        '409':
          $ref: '#/components/responses/BusinessConflict'
  /geo/reports/{reportId}:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Reports]
      summary: GEO 报告首页数据
      responses:
        '200': {description: 报告数据}
  /geo/reports/{reportId}/strategies:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Reports]
      summary: 生成 GEO 改善策略
      responses:
        '202':
          description: 改善策略生成任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /assistant/respond:
    post:
      tags: [Assistant]
      summary: 显问 AI 助手单次回复，不保存聊天记录
      responses:
        '200': {description: 助手回复}
        '409':
          $ref: '#/components/responses/BusinessConflict'
  /subjects/{subjectId}/articles:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      tags: [Articles]
      summary: 文章列表
      responses:
        '200': {description: 文章列表}
    post:
      tags: [Articles]
      summary: 创建文章草稿
      responses:
        '201': {description: 文章草稿}
  /articles/{articleId}/generate:
    parameters:
      - name: articleId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Articles]
      summary: 生成正文并冻结文章额度
      responses:
        '202':
          description: 文章生成任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /articles/{articleId}/channel-adaptations:
    parameters:
      - name: articleId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Publishing]
      summary: 批量生成渠道适配稿
      responses:
        '202':
          description: 渠道适配任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /subjects/{subjectId}/images/generate:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Images]
      summary: 生成一张或一组图片
      responses:
        '202':
          description: 图片生成任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /publication-checks:
    post:
      tags: [Publishing]
      summary: 即时检测发布链接
      responses:
        '200': {description: 发布成功、失败或暂时无法判断}
  /geo/reports/{reportId}/exports:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Reports]
      summary: 生成 PDF、Word 或 Excel
      responses:
        '202':
          description: 报告导出任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /geo/reports/{reportId}/shares:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Reports]
      summary: 创建完整报告分享链接
      responses:
        '201': {description: 分享创建成功}
  /admin/users:
    get:
      tags: [Admin]
      summary: 后台用户列表
      responses:
        '200': {description: 用户列表}
        '403': {description: 权限不足}
  /admin/api-credentials:
    get:
      tags: [Admin]
      summary: API 密钥掩码列表，仅超级管理员
      responses:
        '200': {description: 只返回掩码和状态}
        '403': {description: 非超级管理员禁止}
    post:
      tags: [Admin]
      summary: 新增 API 密钥，明文只在请求中出现
      responses:
        '201': {description: 保存后只返回掩码}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: xianwen_session
  headers:
    RequestId:
      description: 本次请求的规范 UUID；与响应体 request_id 完全一致
      required: true
      schema:
        type: string
        format: uuid
  parameters:
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 可选规范 UUID；非法值由服务端替换
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRFToken
      in: header
      required: true
      description: 从 xianwen_csrf Cookie 读取的 CSRF Token
      schema:
        type: string
  responses:
    ValidationError:
      description: 参数校验失败
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BusinessConflict:
      description: 业务状态冲突、额度不足或超限
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AuthRequired:
      description: 未认证或认证凭证无效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PermissionDenied:
      description: 权限不足
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CsrfFailed:
      description: CSRF 验证失败
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResourceNotFound:
      description: 资源不存在或不可访问
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MethodNotAllowed:
      description: 请求方法不允许
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidJson:
      description: JSON 请求体无法解析
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: 请求频率超过限制
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 服务器内部错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: 数据库或 Redis 不可用
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    EnvelopeBase:
      type: object
      required: [success, request_id]
      properties:
        success: {type: boolean}
        request_id: {type: string, format: uuid}
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [error]
          properties:
            success:
              type: boolean
              const: false
            error:
              type: object
              required: [code, message, details]
              properties:
                code:
                  $ref: '#/components/schemas/ErrorCode'
                message: {type: string}
                details: {type: object, additionalProperties: true}
    ErrorCode:
      type: string
      enum:
        - AUTH_REQUIRED
        - PERMISSION_DENIED
        - CSRF_FAILED
        - RESOURCE_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - INVALID_JSON
        - VALIDATION_ERROR
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_TEMPORARILY_UNAVAILABLE
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: object
              required: [status]
              properties:
                status: {type: string, const: ok}
    CsrfEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [csrf_token]
              properties:
                csrf_token: {type: string}
    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        phone:
          type: string
          description: 中国大陆手机号，允许 +86、0086、空格和短横线等价格式
          examples: ['13800138000', '+8613800138000']
        password: {type: string, minLength: 10, maxLength: 128, format: password}
    LogoutEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [logged_out]
              properties:
                logged_out: {type: boolean, const: true}
    User:
      type: object
      required: [id, phone_masked, nickname, approval_status, account_status]
      properties:
        id: {type: string, format: uuid}
        phone_masked: {type: string}
        nickname: {type: string}
        approval_status:
          type: string
          enum: [pending, approved, rejected]
        account_status:
          type: string
          enum: [active, frozen, cancel_pending, cancelled]
    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'
    CreateSubjectRequest:
      type: object
      required: [subject_type_id, name]
      properties:
        subject_type_id: {type: string, format: uuid}
        name: {type: string}
        fields: {type: object, additionalProperties: true}
    KeywordGenerationRequest:
      type: object
      required: [target_count]
      properties:
        target_count: {type: integer, minimum: 1}
        include_short: {type: boolean, default: false}
        include_long_tail: {type: boolean, default: false}
        include_regional: {type: boolean, default: false}
        regions:
          type: array
          items: {type: string}
        regenerate: {type: boolean, default: false}
    GeoDetectionSelection:
      type: object
      required: [question_ids, model_ids]
      properties:
        question_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, format: uuid}
        model_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, format: uuid}
    GeoEstimateEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                question_count: {type: integer}
                model_count: {type: integer}
                required_detection_points: {type: integer}
                available_detection_points: {type: integer}
                can_submit: {type: boolean}
    AsyncTask:
      type: object
      properties:
        id: {type: string, format: uuid}
        type: {type: string}
        status:
          type: string
          enum: [draft, queued, running, reviewing, partial, succeeded, failed, cancelled, expired]
        progress: {type: integer, minimum: 0, maximum: 100}
        result_id: {type: [string, 'null'], format: uuid}
        user_message: {type: string}
        quota:
          type: object
          properties:
            type: {type: string}
            frozen: {type: integer}
            deducted: {type: integer}
            refunded: {type: integer}
    TaskEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AsyncTask'
