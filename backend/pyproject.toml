[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.django_settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.format]
quote-style = "double"

