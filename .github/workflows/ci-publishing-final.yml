name: Publishing Final CI

on:
  push:
    branches:
      - feature/XW-auto-publishing-center-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Django checks and migrations
        working-directory: backend
        env:
          APP_ENV: test
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Publishing tests
        working-directory: backend
        env:
          APP_ENV: test
          DJANGO_SETTINGS_MODULE: config.settings
        run: python -m pytest tests/test_publishing_foundation.py tests/test_publishing_safety.py -q

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build

  publishing-worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
      - working-directory: publishing-worker
        run: npm install --no-audit --no-fund
      - working-directory: publishing-worker
        run: npm run typecheck
      - working-directory: publishing-worker
        run: npm run check:catalog
      - working-directory: publishing-worker
        run: npm run build
