name: Format Website Draft

on:
  pull_request:
    branches:
      - hotfix/XW-hunyuan-tokenhub-20260827

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Format website frontend files
        working-directory: frontend
        run: |
          npx prettier --write \
            components/website-builder-workspace.tsx \
            components/website-builder-workspace.module.css \
            components/website-draft-preview.module.css \
            lib/websites-client.ts
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/components/website-builder-workspace.tsx \
            frontend/components/website-builder-workspace.module.css \
            frontend/components/website-draft-preview.module.css \
            frontend/lib/websites-client.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: format website frontend"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
