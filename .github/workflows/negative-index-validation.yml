name: Negative Index Validation

on:
  push:
    branches:
      - feature/XW-negative-index-v1

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Format diagnostics
        run: |
          cd backend
          python -m ruff format .
          cd ..
          git diff -- backend
      - name: Backend validation
        run: |
          cd backend
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
          DJANGO_SETTINGS_MODULE=config.django_settings.test python manage.py check
          DJANGO_SETTINGS_MODULE=config.django_settings.test python manage.py makemigrations --check --dry-run
          python -m pytest tests/test_source_index.py tests/test_negative_index.py
      - name: Require committed formatting
        run: git diff --exit-code -- backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Format diagnostics
        run: |
          cd frontend
          npx prettier --write app/geo/data-center/negative-index lib/negative-index-client.ts
          cd ..
          git diff -- frontend/app/geo/data-center/negative-index frontend/lib/negative-index-client.ts
      - name: Frontend validation
        run: |
          cd frontend
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Require committed formatting
        run: git diff --exit-code -- frontend/app/geo/data-center/negative-index frontend/lib/negative-index-client.ts
