name: Admin Audit Frontend Finalization

on:
  push:
    branches:
      - feature/XW-admin-audit-log-v1-20260831

permissions:
  contents: write

jobs:
  frontend-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Format and validate audit frontend only
        working-directory: frontend
        run: |
          npx prettier --write \
            app/admin/operation-records/page.tsx \
            components/admin/admin-console-shell.tsx \
            lib/admin-audit-client.ts \
            tests/admin-rbac-pages.test.tsx
          npx eslint \
            app/admin/operation-records/page.tsx \
            components/admin/admin-console-shell.tsx \
            lib/admin-audit-client.ts \
            tests/admin-rbac-pages.test.tsx
          npx prettier --check \
            app/admin/operation-records/page.tsx \
            components/admin/admin-console-shell.tsx \
            lib/admin-audit-client.ts \
            tests/admin-rbac-pages.test.tsx
          cat > tsconfig.audit-validation.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "incremental": false,
              "noEmit": true
            },
            "include": [
              "next-env.d.ts",
              "app/admin/operation-records/page.tsx",
              "components/admin/admin-console-shell.tsx",
              "lib/admin-audit-client.ts",
              "tests/admin-rbac-pages.test.tsx"
            ]
          }
          EOF
          npx tsc -p tsconfig.audit-validation.json
          npx vitest run tests/admin-rbac-pages.test.tsx

      - name: Commit validated formatting
        run: |
          if git diff --quiet -- \
            frontend/app/admin/operation-records/page.tsx \
            frontend/components/admin/admin-console-shell.tsx \
            frontend/lib/admin-audit-client.ts \
            frontend/tests/admin-rbac-pages.test.tsx; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git diff --check
          git config user.name "xianwen-audit-validation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            frontend/app/admin/operation-records/page.tsx \
            frontend/components/admin/admin-console-shell.tsx \
            frontend/lib/admin-audit-client.ts \
            frontend/tests/admin-rbac-pages.test.tsx
          git commit -m "style(admin): apply validated audit formatting"
          git push origin HEAD:feature/XW-admin-audit-log-v1-20260831
