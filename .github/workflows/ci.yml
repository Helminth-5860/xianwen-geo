name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Report tool versions
        run: python --version && python -m pip --version
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Run backend checks
        run: bash scripts/check.sh backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Report tool versions
        run: node --version && npm --version
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend checks
        run: bash scripts/check.sh frontend

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check repository hygiene
        run: bash scripts/check.sh git
      - name: Scan complete history with reproducible Gitleaks CLI
        run: bash scripts/check.sh gitleaks
      - name: Scan complete Git history with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Validate workflow syntax
        run: bash scripts/check.sh actionlint

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Validate and build Compose services
        run: bash scripts/check.sh docker
      - name: Run PostgreSQL RBAC tests
        run: bash scripts/test-postgres-rbac.sh
      - name: Run PostgreSQL/Redis administrator security tests
        run: bash scripts/test-admin-security.sh
      - name: Run PostgreSQL/Redis high-risk approval tests
        run: bash scripts/test-risk-approval.sh
      - name: Run PostgreSQL plans and immutable versions tests
        run: bash scripts/test-plans.sh
      - name: Run PostgreSQL plan application concurrency tests
        run: bash scripts/test-plan-applications.sh
