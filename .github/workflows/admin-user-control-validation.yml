name: Admin User Control Validation

# Final one-shot pass: frontend-only. It removes itself after success.
on:
  push:
    branches:
      - feature/XW-admin-user-control-center-v1-20260901
    paths:
      - .github/workflows/admin-user-control-validation.yml

permissions:
  contents: write

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Format and validate only user-control frontend files
        working-directory: frontend
        run: |
          npx prettier --write lib/admin-user-control-client.ts components/admin/user-control-center.tsx components/admin/user-control-admin-actions.tsx 'app/admin/users/[id]/control-center/page.tsx'
          npx eslint lib/admin-user-control-client.ts components/admin/user-control-center.tsx components/admin/user-control-admin-actions.tsx 'app/admin/users/[id]/control-center/page.tsx'
          npx prettier --check lib/admin-user-control-client.ts components/admin/user-control-center.tsx components/admin/user-control-admin-actions.tsx 'app/admin/users/[id]/control-center/page.tsx'
          npx tsc --noEmit --pretty false

      - name: Commit formatting and remove one-shot workflow
        run: |
          rm .github/workflows/admin-user-control-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/admin-user-control-client.ts \
            frontend/components/admin/user-control-center.tsx \
            frontend/components/admin/user-control-admin-actions.tsx \
            'frontend/app/admin/users/[id]/control-center/page.tsx' \
            .github/workflows/admin-user-control-validation.yml
          if ! git diff --cached --quiet; then
            git commit -m "style(admin): format validated user control center"
            git push origin HEAD:feature/XW-admin-user-control-center-v1-20260901
          fi
