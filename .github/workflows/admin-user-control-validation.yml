name: Admin User Control Validation

# One-shot validation for the isolated super-admin user control center only.
on:
  push:
    branches:
      - feature/XW-admin-user-control-center-v1-20260901
    paths:
      - .github/workflows/admin-user-control-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Check only user-control backend files
        working-directory: backend
        run: |
          python -m ruff check apps/users/control_center_views.py tests/control_center_api_urls.py tests/test_admin_user_control_center.py
          python -m ruff format --check apps/users/control_center_views.py tests/control_center_api_urls.py tests/test_admin_user_control_center.py

      - name: Run only user-control backend tests
        working-directory: backend
        run: python -m pytest -q tests/test_admin_user_control_center.py

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check only user-control frontend files
        working-directory: frontend
        run: |
          npx eslint lib/admin-user-control-client.ts components/admin/user-control-center.tsx components/admin/user-control-admin-actions.tsx 'app/admin/users/[id]/control-center/page.tsx'
          npx prettier --check lib/admin-user-control-client.ts components/admin/user-control-center.tsx components/admin/user-control-admin-actions.tsx 'app/admin/users/[id]/control-center/page.tsx'
          npx tsc --noEmit --pretty false
