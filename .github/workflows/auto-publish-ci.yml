name: Auto Publish CI

on:
  push:
    branches:
      - feature/XW-auto-publish-v1
  pull_request:
    branches:
      - integration/XW-one-click-geo-website-current-20260828
  workflow_dispatch:

concurrency:
  group: auto-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend publication checks
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Check publication formatting
        run: python -m ruff format --check backend/apps/publications backend/tests/test_publications.py
      - name: Lint publication backend
        run: python -m ruff check backend/apps/publications backend/tests/test_publications.py
      - name: Check Django model state
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django system check
        working-directory: backend
        run: python manage.py check
      - name: Run publication tests
        working-directory: backend
        run: python manage.py test tests.test_publications -v 2

  frontend:
    name: Frontend publication checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check changed frontend formatting
        working-directory: frontend
        run: npx prettier --check app/geo/auto-publish/page.tsx app/geo/auto-publish/auto-publish.module.css lib/publications-client.ts components/user-workspace-navigation.tsx
      - name: Lint automatic publishing UI
        working-directory: frontend
        run: npx eslint app/geo/auto-publish/page.tsx lib/publications-client.ts components/user-workspace-navigation.tsx
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  publication-worker:
    name: Publication worker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build isolated publication worker
        run: docker build --file backend/Dockerfile --target publication --tag xianwen-publication-worker:ci .
