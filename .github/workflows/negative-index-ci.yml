name: Negative Index CI

on:
  pull_request:
    paths:
      - "backend/apps/negative_index/**"
      - "backend/apps/search_discovery/**"
      - "backend/config/**"
      - "backend/tests/test_negative_index*.py"
      - "frontend/app/geo/data-center/negative-index/**"
      - "frontend/lib/negative-index-client.ts"
      - ".github/workflows/negative-index-ci.yml"
  push:
    branches:
      - feature/XW-negative-index-v1
    paths:
      - "backend/apps/negative_index/**"
      - "backend/apps/search_discovery/**"
      - "backend/config/**"
      - "backend/tests/test_negative_index*.py"
      - "frontend/app/geo/data-center/negative-index/**"
      - "frontend/lib/negative-index-client.ts"
      - ".github/workflows/negative-index-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Lint, typecheck and migration consistency
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.django_settings.test
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run source and negative index tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.django_settings.test
        run: |
          python -m pytest \
            tests/test_source_index.py \
            tests/test_negative_index.py \
            tests/test_negative_index_regressions.py

  postgres-regression:
    name: PostgreSQL nullable-lock regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: negative_index
          POSTGRES_USER: negative_index
          POSTGRES_PASSWORD: negative_index_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U negative_index -d negative_index"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Exercise row lock against PostgreSQL
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.django_settings.negative_index_postgres_test
          DATABASE_URL: postgresql://negative_index:negative_index_ci_only@127.0.0.1:5432/negative_index
        run: python -m pytest tests/test_negative_index_regressions.py -k DatabaseLock

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, typecheck, test and build
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
