name: Source Index Current Baseline CI

on:
  push:
    branches:
      - feature/XW-source-index-current-20260828-v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-index-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Lint source-index integration
        working-directory: backend
        run: |
          python -m ruff check apps/source_index tests/test_source_index.py config/settings.py config/urls.py tests/api_urls.py
          python -m ruff format --check apps/source_index tests/test_source_index.py config/settings.py config/urls.py tests/api_urls.py
      - name: Type check source-index app
        working-directory: backend
        run: python -m mypy apps/source_index
      - name: Django checks and migration consistency
        working-directory: backend
        env:
          APP_ENV: test
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Source-index tests
        working-directory: backend
        env:
          APP_ENV: test
        run: python -m pytest tests/test_source_index.py -q

  source-index-frontend-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check frontend client integration
        working-directory: frontend
        run: npm run typecheck
