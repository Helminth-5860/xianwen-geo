name: xianwen-geo

services:
  postgres:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请先复制 .env.example 为 .env}
      POSTGRES_USER: ${POSTGRES_USER:?请先复制 .env.example 为 .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先复制 .env.example 为 .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.0.15-alpine3.20
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?请先复制 .env.example 为 .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      RUN_MIGRATIONS: "true"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:?请先复制 .env.example 为 .env}
      REDIS_URL: ${REDIS_URL:?请先复制 .env.example 为 .env}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?请先复制 .env.example 为 .env}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      SMS_VERIFICATION_HMAC_KEY: ${SMS_VERIFICATION_HMAC_KEY:?请配置随机本地短信 HMAC 密钥}
      SMS_CODE_TTL_SECONDS: ${SMS_CODE_TTL_SECONDS:-300}
      SMS_RESEND_COOLDOWN_SECONDS: ${SMS_RESEND_COOLDOWN_SECONDS:-60}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-5}
      SMS_LIMIT_COMBINATION_COUNT: ${SMS_LIMIT_COMBINATION_COUNT:-5}
      SMS_LIMIT_COMBINATION_WINDOW_SECONDS: ${SMS_LIMIT_COMBINATION_WINDOW_SECONDS:-900}
      SMS_LIMIT_PHONE_COUNT: ${SMS_LIMIT_PHONE_COUNT:-10}
      SMS_LIMIT_PHONE_WINDOW_SECONDS: ${SMS_LIMIT_PHONE_WINDOW_SECONDS:-3600}
      SMS_LIMIT_IP_COUNT: ${SMS_LIMIT_IP_COUNT:-60}
      SMS_LIMIT_IP_WINDOW_SECONDS: ${SMS_LIMIT_IP_WINDOW_SECONDS:-3600}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      LOGIN_RATE_LIMIT_LOCK_SECONDS: ${LOGIN_RATE_LIMIT_LOCK_SECONDS:-900}
      LOGIN_RATE_LIMIT_COMBINATION_FAILURES: ${LOGIN_RATE_LIMIT_COMBINATION_FAILURES:-5}
      LOGIN_RATE_LIMIT_PHONE_FAILURES: ${LOGIN_RATE_LIMIT_PHONE_FAILURES:-10}
      LOGIN_RATE_LIMIT_IP_FAILURES: ${LOGIN_RATE_LIMIT_IP_FAILURES:-30}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "--loglevel=INFO",
        "--queues=system_tasks",
        "--concurrency=2",
      ]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      APP_ENV: ${APP_ENV:-local}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?请先复制 .env.example 为 .env}
      DJANGO_DEBUG: "false"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:?请先复制 .env.example 为 .env}
      REDIS_URL: ${REDIS_URL:?请先复制 .env.example 为 .env}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?请先复制 .env.example 为 .env}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      SMS_VERIFICATION_HMAC_KEY: ${SMS_VERIFICATION_HMAC_KEY:?请配置随机本地短信 HMAC 密钥}
      SMS_CODE_TTL_SECONDS: ${SMS_CODE_TTL_SECONDS:-300}
      SMS_RESEND_COOLDOWN_SECONDS: ${SMS_RESEND_COOLDOWN_SECONDS:-60}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-5}
      SMS_LIMIT_COMBINATION_COUNT: ${SMS_LIMIT_COMBINATION_COUNT:-5}
      SMS_LIMIT_COMBINATION_WINDOW_SECONDS: ${SMS_LIMIT_COMBINATION_WINDOW_SECONDS:-900}
      SMS_LIMIT_PHONE_COUNT: ${SMS_LIMIT_PHONE_COUNT:-10}
      SMS_LIMIT_PHONE_WINDOW_SECONDS: ${SMS_LIMIT_PHONE_WINDOW_SECONDS:-3600}
      SMS_LIMIT_IP_COUNT: ${SMS_LIMIT_IP_COUNT:-60}
      SMS_LIMIT_IP_WINDOW_SECONDS: ${SMS_LIMIT_IP_WINDOW_SECONDS:-3600}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  rbac-tests:
    profiles: ["rbac-test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    command:
      ["python", "-m", "pytest", "tests/test_admin_rbac_postgres.py", "--ds=config.settings", "-q", "-p", "no:cacheprovider"]
    environment:
      APP_ENV: local
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?请先复制 .env.example 为 .env}
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:?请先复制 .env.example 为 .env}
      REDIS_URL: ${REDIS_URL:?请先复制 .env.example 为 .env}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?请先复制 .env.example 为 .env}
      SMS_PROVIDER: mock
      SMS_VERIFICATION_HMAC_KEY: ${SMS_VERIFICATION_HMAC_KEY:?请配置随机本地短信 HMAC 密钥}
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  admin-security-tests:
    profiles: ["admin-security-test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    command:
      ["python", "-m", "pytest", "tests/test_admin_security_postgres.py", "--ds=config.settings", "-q", "-p", "no:cacheprovider"]
    environment:
      APP_ENV: local
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in local .env}
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in local .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in local .env}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL in local .env}
      SMS_PROVIDER: mock
      SMS_VERIFICATION_HMAC_KEY: ${SMS_VERIFICATION_HMAC_KEY:?set a random local SMS HMAC key}
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  risk-approval-tests:
    profiles: ["risk-approval-test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    command:
      ["python", "-m", "pytest", "tests/test_risk_approval_postgres.py", "--ds=config.settings", "-q", "-p", "no:cacheprovider"]
    environment:
      APP_ENV: local
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in local .env}
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in local .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in local .env}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL in local .env}
      SMS_PROVIDER: mock
      SMS_VERIFICATION_HMAC_KEY: ${SMS_VERIFICATION_HMAC_KEY:?set a random local SMS HMAC key}
      RISK_APPROVAL_TTL_SECONDS: 86400
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  plans-tests:
    profiles: ["plans-test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    command:
      ["python", "-m", "pytest", "tests/test_plans_postgres.py", "--ds=config.settings", "-q", "-p", "no:cacheprovider"]
    environment:
      APP_ENV: local
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY for isolated test}
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:?set isolated test DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set isolated test REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set isolated test broker URL}
      SMS_PROVIDER: mock
      SMS_VERIFICATION_HMAC_KEY: ${SMS_VERIFICATION_HMAC_KEY:?set isolated test SMS HMAC key}
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  plan-application-tests:
    profiles: ["plan-application-test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    command:
      ["python", "-m", "pytest", "tests/test_plan_applications_postgres.py", "--ds=config.settings", "-q", "-p", "no:cacheprovider"]
    environment:
      APP_ENV: local
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY for isolated test}
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:?set isolated test DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set isolated test REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set isolated test broker URL}
      SMS_PROVIDER: mock
      SMS_VERIFICATION_HMAC_KEY: ${SMS_VERIFICATION_HMAC_KEY:?set isolated test SMS HMAC key}
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy




  subscription-tests:
    profiles: ["subscription-test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    command:
      ["python", "-m", "pytest", "tests/test_subscriptions_postgres.py", "--ds=config.settings", "-q", "-p", "no:cacheprovider"]
    environment:
      APP_ENV: local
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY for isolated test}
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:?set isolated test DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set isolated test REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set isolated test broker URL}
      SMS_PROVIDER: mock
      SMS_VERIFICATION_HMAC_KEY: ${SMS_VERIFICATION_HMAC_KEY:?set isolated test SMS HMAC key}
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-local}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-local}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
