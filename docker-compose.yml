name: xianwen-geo

services:
  postgres:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请先复制 .env.example 为 .env}
      POSTGRES_USER: ${POSTGRES_USER:?请先复制 .env.example 为 .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先复制 .env.example 为 .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.0.15-alpine3.20
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?请先复制 .env.example 为 .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      RUN_MIGRATIONS: "true"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:?请先复制 .env.example 为 .env}
      REDIS_URL: ${REDIS_URL:?请先复制 .env.example 为 .env}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?请先复制 .env.example 为 .env}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  celery:
    build:
      context: ./backend
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "--loglevel=INFO",
        "--queues=system_tasks",
        "--concurrency=2",
      ]
    environment:
      APP_ENV: ${APP_ENV:-local}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?请先复制 .env.example 为 .env}
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DATABASE_URL: ${DATABASE_URL:?请先复制 .env.example 为 .env}
      REDIS_URL: ${REDIS_URL:?请先复制 .env.example 为 .env}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?请先复制 .env.example 为 .env}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

