  web-fetch-worker:
    extends:
      service: celery
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "--loglevel=INFO",
        "--queues=web_fetch",
        "--concurrency=1",
        "--prefetch-multiplier=1",
        "--time-limit=45",
        "--soft-time-limit=40",
      ]
    privileged: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    extends:
      service: celery
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/xianwen-celerybeat-schedule",
      ]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  rbac-tests:
    profiles: ["rbac-test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    command:
      ["python", "-m", "pytest", "tests/test_admin_rbac_postgres.py", "--ds=config.settings", "-q", "-p", "no:cacheprovider"]
    environment:
      APP_ENV: local
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?请先复制 .env.example 为 .env}
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:?请先复制 .env.example 为 .env}
      REDIS_URL: ${REDIS_URL:?请先复制 .env.example 为 .env}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?请先复制 .env.example 为 .env}
      SMS_PROVIDER: mock
      SMS_VERIFICATION_HMAC_KEY: ${SMS_VERIFICATION_HMAC_KEY:?请配置随机本地短信 HMAC 密钥}
      QUOTA_IDEMPOTENCY_HMAC_KEY: ${QUOTA_IDEMPOTENCY_HMAC_KEY:?set a random local quota HMAC key}
