      PLAN_CHANGE_IDEMPOTENCY_HMAC_KEY: ${PLAN_CHANGE_IDEMPOTENCY_HMAC_KEY:?set a random local plan-change HMAC key}
      ARTICLE_IDEMPOTENCY_HMAC_KEY: ${ARTICLE_IDEMPOTENCY_HMAC_KEY:-local-test-article-idempotency-key-not-for-production}
      REPORT_SHARE_HMAC_KEY: ${REPORT_SHARE_HMAC_KEY:-local-test-report-share-hmac-key-not-for-production}
      WEB_IMPORT_ENABLED: ${WEB_IMPORT_ENABLED:-true}
      WEB_IMPORT_NETWORK_POLICY_ENFORCED: ${WEB_IMPORT_NETWORK_POLICY_ENFORCED:-true}
