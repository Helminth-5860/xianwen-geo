name: xianwen-geo

services:
  postgres:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请先复制 .env.example 为 .env}
      POSTGRES_USER: ${POSTGRES_USER:?请先复制 .env.example 为 .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先复制 .env.example 为 .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.0.15-alpine3.20
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?请先复制 .env.example 为 .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      RUN_MIGRATIONS: "true"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:?请先复制 .env.example 为 .env}
      REDIS_URL: ${REDIS_URL:?请先复制 .env.example 为 .env}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?请先复制 .env.example 为 .env}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      ENABLE_REAL_SMS: ${ENABLE_REAL_SMS:-false}
      SMS_REGION: ${SMS_REGION:-}
      SMS_APP_ID: ${SMS_APP_ID:-}
      SMS_SECRET_ID: ${SMS_SECRET_ID:-}
      SMS_SECRET_KEY: ${SMS_SECRET_KEY:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_REGISTER: ${SMS_TEMPLATE_REGISTER:-}
      SMS_TEMPLATE_LOGIN: ${SMS_TEMPLATE_LOGIN:-}
      SMS_TEMPLATE_SECURITY: ${SMS_TEMPLATE_SECURITY:-}
      SMS_TEMPLATE_REVIEW: ${SMS_TEMPLATE_REVIEW:-}
      SMS_TEMPLATE_PLAN_EXPIRY: ${SMS_TEMPLATE_PLAN_EXPIRY:-}
      SMS_PROVIDER_TIMEOUT_SECONDS: ${SMS_PROVIDER_TIMEOUT_SECONDS:-10}
      SMS_VERIFICATION_HMAC_KEY: ${SMS_VERIFICATION_HMAC_KEY:?请配置随机本地短信 HMAC 密钥}
      QUOTA_IDEMPOTENCY_HMAC_KEY: ${QUOTA_IDEMPOTENCY_HMAC_KEY:?set a random local quota HMAC key}
      GEO_DETECTION_IDEMPOTENCY_HMAC_KEY: ${GEO_DETECTION_IDEMPOTENCY_HMAC_KEY:-local-test-geo-detection-idempotency-key-not-for-production}
      GEO_DETECTION_GLOBAL_MAX_CONCURRENCY: ${GEO_DETECTION_GLOBAL_MAX_CONCURRENCY:-32}
      GEO_DETECTION_QUEUE_TIMEOUT_SECONDS: ${GEO_DETECTION_QUEUE_TIMEOUT_SECONDS:-900}
      GEO_DETECTION_DISPATCH_BATCH: ${GEO_DETECTION_DISPATCH_BATCH:-100}
      GEO_DETECTION_INTERNAL_MAX_RETRIES: ${GEO_DETECTION_INTERNAL_MAX_RETRIES:-3}
      PLAN_CHANGE_IDEMPOTENCY_HMAC_KEY: ${PLAN_CHANGE_IDEMPOTENCY_HMAC_KEY:?set a random local plan-change HMAC key}
      ARTICLE_IDEMPOTENCY_HMAC_KEY: ${ARTICLE_IDEMPOTENCY_HMAC_KEY:-local-test-article-idempotency-key-not-for-production}
      REPORT_SHARE_HMAC_KEY: ${REPORT_SHARE_HMAC_KEY:-local-test-report-share-hmac-key-not-for-production}
      WEB_IMPORT_ENABLED: ${WEB_IMPORT_ENABLED:-true}
      WEB_IMPORT_NETWORK_POLICY_ENFORCED: ${WEB_IMPORT_NETWORK_POLICY_ENFORCED:-true}
      WEB_IMPORT_IDEMPOTENCY_HMAC_KEY: ${WEB_IMPORT_IDEMPOTENCY_HMAC_KEY:?set an independent web import HMAC key}
      SUBJECT_ENRICHMENT_PROVIDER: ${SUBJECT_ENRICHMENT_PROVIDER:-mock}
      SUBJECT_ENRICHMENT_IDEMPOTENCY_HMAC_KEY: ${SUBJECT_ENRICHMENT_IDEMPOTENCY_HMAC_KEY:-local-test-subject-enrichment-idempotency-key-not-for-production}
      SMS_CODE_TTL_SECONDS: ${SMS_CODE_TTL_SECONDS:-300}
      SMS_RESEND_COOLDOWN_SECONDS: ${SMS_RESEND_COOLDOWN_SECONDS:-60}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-5}
      SMS_LIMIT_COMBINATION_COUNT: ${SMS_LIMIT_COMBINATION_COUNT:-5}
      SMS_LIMIT_COMBINATION_WINDOW_SECONDS: ${SMS_LIMIT_COMBINATION_WINDOW_SECONDS:-900}
      SMS_LIMIT_PHONE_COUNT: ${SMS_LIMIT_PHONE_COUNT:-10}
      SMS_LIMIT_PHONE_WINDOW_SECONDS: ${SMS_LIMIT_PHONE_WINDOW_SECONDS:-3600}
      SMS_LIMIT_IP_COUNT: ${SMS_LIMIT_IP_COUNT:-60}
      SMS_LIMIT_IP_WINDOW_SECONDS: ${SMS_LIMIT_IP_WINDOW_SECONDS:-3600}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      LOGIN_RATE_LIMIT_LOCK_SECONDS: ${LOGIN_RATE_LIMIT_LOCK_SECONDS:-900}
      LOGIN_RATE_LIMIT_COMBINATION_FAILURES: ${LOGIN_RATE_LIMIT_COMBINATION_FAILURES:-5}
      LOGIN_RATE_LIMIT_PHONE_FAILURES: ${LOGIN_RATE_LIMIT_PHONE_FAILURES:-10}
      LOGIN_RATE_LIMIT_IP_FAILURES: ${LOGIN_RATE_LIMIT_IP_FAILURES:-30}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "--loglevel=INFO",
        "--queues=system_tasks,ai_content",
        "--concurrency=2",
      ]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      APP_ENV: ${APP_ENV:-local}
