      SMS_CODE_TTL_SECONDS: ${SMS_CODE_TTL_SECONDS:-300}
      SMS_RESEND_COOLDOWN_SECONDS: ${SMS_RESEND_COOLDOWN_SECONDS:-60}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-5}
      SMS_LIMIT_COMBINATION_COUNT: ${SMS_LIMIT_COMBINATION_COUNT:-5}
      SMS_LIMIT_COMBINATION_WINDOW_SECONDS: ${SMS_LIMIT_COMBINATION_WINDOW_SECONDS:-900}
      SMS_LIMIT_PHONE_COUNT: ${SMS_LIMIT_PHONE_COUNT:-10}
      SMS_LIMIT_PHONE_WINDOW_SECONDS: ${SMS_LIMIT_PHONE_WINDOW_SECONDS:-3600}
      SMS_LIMIT_IP_COUNT: ${SMS_LIMIT_IP_COUNT:-60}
      SMS_LIMIT_IP_WINDOW_SECONDS: ${SMS_LIMIT_IP_WINDOW_SECONDS:-3600}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    depends_on:
