services:
  question-migrate:
    profiles: [questions-test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: &question-env
      DJANGO_SETTINGS_MODULE: config.django_settings.questions_test
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set isolated question test secret}
      DATABASE_URL: ${DATABASE_URL:?set isolated question test database URL}
      QUESTION_GENERATION_IDEMPOTENCY_HMAC_KEY: ${QUESTION_GENERATION_IDEMPOTENCY_HMAC_KEY:?set isolated question generation HMAC key}
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres: {condition: service_healthy}

  question-tests:
    profiles: [questions-test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    command:
      - python
      - -m
      - pytest
      - tests/test_question_catalog.py
      - tests/test_question_catalog_postgres.py
      - tests/test_question_bank.py
      - tests/test_question_bank_postgres.py
      - -x
      - --reuse-db
      - -p
      - no:cacheprovider
    environment: *question-env
    depends_on:
      postgres: {condition: service_healthy}
